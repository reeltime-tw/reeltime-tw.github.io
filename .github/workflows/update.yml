name: 發布網站

# 場次資料由你的電腦每天早上抓取後推上來（台灣網路，各影城都連得到），
# 這裡只負責把 docs/ 發布到 GitHub Pages。
on:
  push:
    branches: [main]
    paths: ['docs/**', '.github/workflows/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: 若專案內還沒有場次資料，沿用網站上現有的
        run: |
          if [ ! -f docs/data.json ]; then
            curl -fsSL "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/data.json" -o docs/data.json || echo "目前沒有可沿用的資料"
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
