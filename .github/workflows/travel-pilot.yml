name: 路程計算-試算（開發階段）
on:
  workflow_dispatch:
    inputs:
      operators:
        description: 捷運代碼，逗號分隔
        default: TRTC
        required: false

# 所有 job 都會打 TDX，刻意串行（needs）而不平行，避免同帳號同時打多個請求
# 互相觸發 rate limit。
jobs:
  explore-bus-tra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 探索公車／台鐵資料格式
        env:
          TDX_CLIENT_ID: ${{ secrets.TDX_CLIENT_ID }}
          TDX_CLIENT_SECRET: ${{ secrets.TDX_CLIENT_SECRET }}
        run: python3 tools/travel/explore_bus_tra.py

  check-bus-size:
    needs: explore-bus-tra
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 量測公車資料量
        env:
          TDX_CLIENT_ID: ${{ secrets.TDX_CLIENT_ID }}
          TDX_CLIENT_SECRET: ${{ secrets.TDX_CLIENT_SECRET }}
        run: python3 tools/travel/check_bus_size.py

  gtfs-metro:
    needs: check-bus-size
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 轉換 TDX 捷運資料成 GTFS
        env:
          TDX_CLIENT_ID: ${{ secrets.TDX_CLIENT_ID }}
          TDX_CLIENT_SECRET: ${{ secrets.TDX_CLIENT_SECRET }}
          OPS: ${{ inputs.operators }}
        run: |
          IFS=',' read -ra OPARR <<< "$OPS"
          python3 tools/travel/tdx2gtfs_metro.py "${OPARR[@]}"

      - name: 驗證輸出的 GTFS
        run: python3 tools/travel/validate_gtfs.py gtfs_out/metro

      - name: 列出並印出部分內容供人工檢查
        run: |
          echo "--- stops.txt（前 5 行）---"
          head -6 gtfs_out/metro/stops.txt
          echo "--- routes.txt ---"
          cat gtfs_out/metro/routes.txt
          echo "--- calendar.txt ---"
          cat gtfs_out/metro/calendar.txt
          echo "--- frequencies.txt（前 10 行）---"
          head -11 gtfs_out/metro/frequencies.txt
          echo "--- stop_times.txt 筆數與前 5 行 ---"
          wc -l gtfs_out/metro/stop_times.txt
          head -6 gtfs_out/metro/stop_times.txt

  gtfs-bus:
    needs: gtfs-metro
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 轉換 TDX 公車資料成 GTFS（限 3 間試算影城 2 公里內）
        env:
          TDX_CLIENT_ID: ${{ secrets.TDX_CLIENT_ID }}
          TDX_CLIENT_SECRET: ${{ secrets.TDX_CLIENT_SECRET }}
        run: python3 tools/travel/tdx2gtfs_bus.py

      - name: 驗證輸出的 GTFS
        run: python3 tools/travel/validate_gtfs.py gtfs_out/bus

      - name: 列出部分內容供人工檢查
        run: |
          echo "--- routes.txt（前 10 行）---"
          head -11 gtfs_out/bus/routes.txt
          echo "--- stops.txt 筆數 ---"
          wc -l gtfs_out/bus/stops.txt
          echo "--- frequencies.txt（前 5 行）---"
          head -6 gtfs_out/bus/frequencies.txt
          echo "--- calendar.txt ---"
          cat gtfs_out/bus/calendar.txt
