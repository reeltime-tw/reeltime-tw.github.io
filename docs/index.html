<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="color-scheme" content="light">
<title>開場｜全台電影場次</title>
<meta name="description" content="全台影城場次一次看，選好場次直接到官網訂票。">
<meta name="application-name" content="開場">
<meta name="apple-mobile-web-app-title" content="開場">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f6f8; --surface:#ffffff; --ink:#16181d; --ink2:#5b6270; --ink3:#8a909c; --line:#e2e5ea; --line2:#eef0f3;
  --red:#b3122e; --red-soft:#fbeef0; --ok:#1f7a4d; --ok-soft:#e8f4ee; --warn:#9a5208; --warn-soft:#fdf3e6;
  --num:"Barlow Condensed","Arial Narrow",sans-serif;
  --hd:52px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:150px}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;line-height:1.55;font-size:15px}
body{padding-bottom:calc(68px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
a{color:inherit}
:focus-visible{outline:2px solid var(--red);outline-offset:2px;border-radius:6px}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---- 頂部 ---- */
header{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.96);backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.bar{height:var(--hd);display:flex;align-items:center;gap:8px}
.brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:19px;letter-spacing:2px;white-space:nowrap;margin-right:auto;line-height:1.15}
.brand img{border-radius:8px;flex:0 0 auto}
.brand small{display:block;font-weight:400;font-size:11px;color:var(--ink3);letter-spacing:0;line-height:1.3}
.loc{display:flex;align-items:center;gap:4px;height:36px;padding:0 12px;border-radius:18px;background:var(--bg);border:1px solid var(--line);font-size:14px;font-weight:600;white-space:nowrap}
.loc svg{width:16px;height:16px;color:var(--red)}
.ibtn{width:40px;height:40px;border-radius:20px;display:grid;place-items:center;color:var(--ink2)}
.ibtn:hover{background:var(--bg)}
.ibtn svg{width:21px;height:21px}
.back{display:flex;align-items:center;gap:2px;height:40px;padding-right:10px;margin-left:-8px;font-size:15px;color:var(--ink)}
.back svg{width:24px;height:24px}

/* ---- 日期列 ---- */
.dates{display:flex;gap:6px;overflow-x:auto;padding:8px 16px 10px;margin:0 -16px;scrollbar-width:none}
.dates::-webkit-scrollbar{display:none}
.d{flex:0 0 auto;width:52px;padding:5px 0 6px;border-radius:12px;border:1px solid transparent;display:flex;flex-direction:column;align-items:center;color:var(--ink2);font-size:12px;line-height:1.2}
.d b{font-family:var(--num);font-size:24px;font-weight:600;color:var(--ink);line-height:1.05;margin-top:2px}
.d.none{opacity:.38}
.d:hover{border-color:var(--line)}
.d[aria-pressed=true]{background:var(--ink);color:#fff}
.d[aria-pressed=true] b{color:#fff}

/* ---- 篩選列 ---- */
.fbar{display:flex;gap:6px;overflow-x:auto;padding:0 16px 10px;margin:0 -16px;scrollbar-width:none}
.fbar::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;display:inline-flex;align-items:center;gap:4px;height:34px;padding:0 13px;border-radius:17px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:14px;white-space:nowrap}
.chip svg{width:16px;height:16px}
.chip[aria-pressed=true]{background:var(--red-soft);border-color:var(--red);color:var(--red);font-weight:600}
.chip .n{min-width:18px;height:18px;border-radius:9px;background:var(--red);color:#fff;font-size:11px;display:inline-grid;place-items:center;padding:0 5px}
.chip.x{background:var(--red-soft);border-color:transparent;color:var(--red)}

main{padding:14px 0 24px;min-height:60vh}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:22px 0 10px}
.sec-h:first-child{margin-top:4px}
.sec-h h2{margin:0;font-size:17px}
.sec-h span{font-size:13px;color:var(--ink3)}

/* ---- 電影格 ---- */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 12px}
@media(min-width:540px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(min-width:720px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.mv{display:block;text-align:left;width:100%;text-decoration:none;color:inherit}
.cin-h a,.row a{color:inherit}
.poster{position:relative;aspect-ratio:2/3;border-radius:10px;overflow:hidden;background:var(--line2)}
.poster img{width:100%;height:100%;object-fit:cover;display:block}
.mv:hover .poster img{transform:scale(1.02)}
.poster img{transition:transform .25s}
@media(prefers-reduced-motion:reduce){.poster img{transition:none}}
.rt{position:absolute;right:6px;top:6px;min-width:26px;height:20px;padding:0 5px;border-radius:5px;font-size:11px;font-weight:700;display:grid;place-items:center;color:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.rt-普{background:#2b8a3e}.rt-護{background:#1c64c4}.rt-輔12{background:#e3b505;color:#3a2d00}.rt-輔15{background:#e8590c}.rt-限{background:#c92a2a}
.flag{position:absolute;left:0;bottom:0;right:0;padding:16px 8px 6px;background:linear-gradient(transparent,rgba(0,0,0,.72));color:#fff;font-size:12px;font-weight:600}
.mv h3{margin:8px 0 0;font-size:15px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mv p{margin:2px 0 0;font-size:13px;color:var(--ink2)}
.mv p b{font-family:var(--num);font-size:16px;font-weight:600;color:var(--red)}

/* ---- 列表 ---- */
.list{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.row{display:flex;align-items:center;gap:10px;padding:12px 14px;width:100%;text-align:left;border-top:1px solid var(--line2)}
.row:first-child{border-top:0}
.row:hover{background:#fafbfc}
.row .main{flex:1;min-width:0}
.row h3{margin:0;font-size:15.5px;line-height:1.35}
.row .sub{font-size:13px;color:var(--ink2)}
.row .side{text-align:right;font-size:12px;color:var(--ink3);white-space:nowrap}
.row .side b{display:block;font-family:var(--num);font-size:22px;font-weight:600;color:var(--ink);line-height:1}
.star{width:40px;height:40px;flex:0 0 auto;display:grid;place-items:center;border-radius:20px;color:var(--ink3)}
.star svg{width:21px;height:21px}
.star[aria-pressed=true]{color:#e0a400}
.star:hover{background:var(--bg)}
.publine{font-size:12px;color:var(--ink3);margin-top:2px}
.publine .ok{color:var(--ok)}

/* ---- 電影頁 ---- */
.hero{display:flex;gap:14px;align-items:flex-start}
.hero .poster{width:108px;flex:0 0 auto;border-radius:10px}
.hero h1{margin:0;font-size:21px;line-height:1.3}
.hero .en{font-size:13px;color:var(--ink3);margin-top:2px}
.facts{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.fact{font-size:12px;padding:2px 8px;border-radius:6px;background:var(--bg);border:1px solid var(--line);color:var(--ink2)}
.syn{font-size:14px;color:var(--ink2);margin:14px 0 0;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.syn.open{display:block}
.more{font-size:13px;color:var(--red);margin-top:2px;padding:4px 0}

.cin{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px 14px;margin-bottom:10px}
.cin-h{display:flex;align-items:flex-start;gap:6px}
.cin-h .main{flex:1;min-width:0}
.cin-h h3{margin:0;font-size:16px;line-height:1.35}
.cin-h a{text-decoration:none}
.cin-h .sub{font-size:13px;color:var(--ink2)}
.cin .star{margin:-6px -8px 0 0}
.fg{margin-top:10px}
.fg-l{font-size:12.5px;color:var(--ink2);margin-bottom:6px}
.stubs{display:flex;flex-wrap:wrap;gap:8px}
.past{font-size:13px;color:var(--ink3);margin-top:10px;padding:4px 0}

/* 票根：左右半圓缺口 */
.stub{--c:var(--surface);position:relative;min-width:76px;padding:6px 12px 5px;text-align:center;background:
  radial-gradient(circle at 0 50%,transparent 5px,var(--c) 5.5px) left/51% 100% no-repeat,
  radial-gradient(circle at 100% 50%,transparent 5px,var(--c) 5.5px) right/51% 100% no-repeat;
  filter:drop-shadow(0 0 .6px rgba(22,24,29,.55)) drop-shadow(0 1px 1px rgba(22,24,29,.08));border-radius:7px}
.stub b{display:block;font-family:var(--num);font-size:23px;font-weight:600;line-height:1.05;letter-spacing:.3px}
.stub span{display:block;font-size:11px;color:var(--ink3);line-height:1.3}
.stub:hover{--c:var(--red-soft)}
.stub:hover b{color:var(--red)}
.stub.low span{color:var(--warn)}
.stub.out{opacity:.5}
.stub.out b{text-decoration:line-through}

.cin-l{display:flex;gap:12px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line2)}
.cin-l:first-of-type{border-top:0;padding-top:0}
.cin-l .poster{width:56px;flex:0 0 auto;border-radius:6px}
.cin-l .main{flex:1;min-width:0}
.cin-l h3{margin:0 0 2px;font-size:15px}
.cin-l h3 button{text-align:left}

.notice{border-radius:12px;padding:12px 14px;font-size:14px;background:var(--surface);border:1px solid var(--line)}
.notice b{font-weight:700}
.notice.warn{background:var(--warn-soft);border-color:#f2dcbf}
.pubbox{display:grid;gap:4px;font-size:13.5px;color:var(--ink2)}
.pubbox b{color:var(--ink)}
.tag{display:inline-block;font-size:11px;padding:0 6px;border-radius:4px;margin-left:4px;vertical-align:1px}
.tag.ok{background:var(--ok-soft);color:var(--ok)}
.tag.est{background:var(--bg);color:var(--ink3);border:1px solid var(--line)}

.empty{text-align:center;padding:40px 16px;color:var(--ink2);font-size:14px}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:6px}
.empty .btn{margin-top:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:44px;padding:0 18px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:14.5px;text-decoration:none}
.btn.pri{background:var(--red);border-color:var(--red);color:#fff}
.btn.block{display:flex;width:100%}
.links{display:flex;gap:8px;margin-top:12px}
.links .btn{flex:1;height:40px;font-size:13.5px}

.search{display:flex;align-items:center;gap:8px;height:44px;padding:0 12px;border-radius:12px;background:var(--surface);border:1px solid var(--line)}
.search svg{width:18px;height:18px;color:var(--ink3);flex:0 0 auto}
.search input{flex:1;border:0;outline:0;background:none;font:inherit;font-size:16px;color:var(--ink);min-width:0}

.foot{text-align:center;font-size:12.5px;color:var(--ink3);margin-top:28px}
.foot button{color:var(--ink2);text-decoration:underline;font-size:12.5px}
.banner{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:12px;background:var(--surface);border:1px solid var(--line);margin-bottom:14px;font-size:14px}
.banner svg{width:22px;height:22px;color:var(--red);flex:0 0 auto}
.banner .main{flex:1}
.banner.demo{background:var(--warn-soft);border-color:#f2dcbf;color:var(--warn)}

/* ---- 底部分頁 ---- */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(255,255,255,.97);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabbar .in{max-width:760px;margin:0 auto;display:flex}
.tabbar a{flex:1;height:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11.5px;color:var(--ink3);text-decoration:none}
.tabbar a[aria-current=page]{color:var(--red);font-weight:600}
.tabbar svg{width:23px;height:23px}

/* ---- 底部彈出面板 ---- */
.ov{position:fixed;inset:0;z-index:50;background:rgba(22,24,29,.42);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:760px;max-height:90vh;overflow:auto;background:var(--surface);border-radius:20px 20px 0 0;padding:8px 16px calc(20px + env(safe-area-inset-bottom));animation:up .2s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:0}}
@media(prefers-reduced-motion:reduce){.sheet{animation:none}}
/* 搜尋：從上方展開的全螢幕畫面，輸入框固定在頂端，手機鍵盤不會擋住 */
.ov.top{align-items:flex-start;background:var(--bg)}
.sheet.full{height:100%;max-height:none;border-radius:0;padding:calc(8px + env(safe-area-inset-top)) 16px 24px;background:var(--bg);animation:down .18s ease-out}
@keyframes down{from{transform:translateY(-12px);opacity:0}}
@media(prefers-reduced-motion:reduce){.sheet.full{animation:none}}
.qhead{position:sticky;top:calc(-8px - env(safe-area-inset-top));z-index:2;display:flex;align-items:center;gap:8px;padding:8px 0 10px;background:var(--bg)}
.qhead .search{flex:1}
.qhead .cancel{height:44px;padding:0 4px 0 8px;font-size:15px;color:var(--red);white-space:nowrap}
.grab{width:38px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 10px}
.sheet h2{margin:4px 0 12px;font-size:18px}
.sheet h4{margin:18px 0 8px;font-size:14px;color:var(--ink2);font-weight:600}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.sum{border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:14px}
.sum div{display:flex;justify-content:space-between;gap:12px;padding:10px 14px;border-top:1px solid var(--line2);font-size:14.5px}
.sum div:first-child{border-top:0}
.sum span{color:var(--ink2);flex:0 0 auto}
.sum b{text-align:right}
.note{font-size:12.5px;color:var(--ink3);margin-top:10px}
.sheet-foot{display:flex;gap:8px;margin-top:18px}
.sheet-foot .btn{flex:1}
details{margin-top:16px;font-size:13px;color:var(--ink2)}
textarea{width:100%;min-height:90px;margin-top:8px;border:1px solid var(--line);border-radius:10px;padding:8px;font:12px/1.4 ui-monospace,monospace}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(78px + env(safe-area-inset-bottom));background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:70;max-width:90vw}
.skel{background:linear-gradient(90deg,var(--line2),#f7f8fa,var(--line2));background-size:200% 100%;animation:sk 1.2s infinite linear;border-radius:10px}
@keyframes sk{to{background-position:-200% 0}}
@media(prefers-reduced-motion:reduce){.skel{animation:none}}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="bar" id="bar"></div>
    <div id="sub"></div>
  </div>
</header>
<main class="wrap" id="view"></main>

<nav class="tabbar" aria-label="主選單"><div class="in">
  <a href="#/" data-nav="now"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 4v16M17 4v16M3 9h4M3 15h4M17 9h4M17 15h4"/></svg>現正上映</a>
  <a href="#/cinemas" data-nav="cinemas"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s7-6.2 7-12a7 7 0 1 0-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="9" r="2.5"/></svg>影城</a>
  <a href="#/soon" data-nav="soon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>即將上映</a>
</div></nav>
<div id="layer"></div>

<script>
/* ================= 資料格式 =================
 * {
 *  "updatedAt":"ISO 時間", "status":[{chain,ok,shows}],
 *  "movies":[{"id","title","en","rating","runtime","genre","release":"YYYY-MM-DD","status":"now|soon","presale","synopsis","poster","posterLocal"}],
 *  "cinemas":[{"id","chain","name","region","city","addr","site","ticketUrl",
 *     "publish":{"publishedUntil","nextAt":"YYYY-MM-DDTHH:mm","rangeFrom","rangeTo","official|estimated","presale"}}],
 *  "showtimes":[{"cinema","movie","date","time","format","hall","seats":"open|low|out","url"}]
 * }
 */
const WD=['日','一','二','三','四','五','六'];
const REGION_ORDER=['北部','中部','南部','東部','離島'];
const CITY_ORDER=['台北市','新北市','基隆市','桃園市','新竹市','新竹縣','宜蘭縣','苗栗縣','台中市','彰化縣','南投縣','雲林縣','嘉義市','嘉義縣','台南市','高雄市','屏東縣','花蓮縣','台東縣','澎湖縣','金門縣','連江縣'];
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const parseYmd=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const md=s=>{if(!s)return '';const d=parseYmd(s.slice(0,10));return (d.getMonth()+1)+'/'+d.getDate()+'（'+WD[d.getDay()]+'）'};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const TODAY=new Date(); TODAY.setHours(0,0,0,0);
const todayS=ymd(TODAY), tomorrowS=ymd(addDays(TODAY,1));
const nowHM=()=>{const d=new Date();return pad(d.getHours())+':'+pad(d.getMinutes())};
// 影城把凌晨 0–3 點的午夜場列在前一天，排序時當成 24–27 點
const tkey=t=>{const h=+t.slice(0,2);return (h<4?h+24:h)+t.slice(2)};
const dayName=s=>s===todayS?'今天':s===tomorrowS?'明天':'週'+WD[parseYmd(s).getDay()];
const store={get(k,d){try{const v=localStorage.getItem('twc.'+k);return v==null?d:JSON.parse(v)}catch{return d}},set(k,v){try{localStorage.setItem('twc.'+k,JSON.stringify(v))}catch{}}};
const ICON={
  pin:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s7-6.2 7-12a7 7 0 1 0-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="9" r="2.5"/></svg>',
  search:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>',
  back:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',
  down:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>',
  filter:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M7 12h10M10 18h4"/></svg>',
  star:'<svg viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M12 3.5l2.6 5.3 5.8.8-4.2 4.1 1 5.8-5.2-2.7-5.2 2.7 1-5.8-4.2-4.1 5.8-.8z"/></svg>',

/* ---- 縣市（舊資料沒有縣市時，從店名推斷）---- */
const COUNTY=/^(苗栗|彰化|南投|雲林|屏東|宜蘭|花蓮|台東|澎湖|金門|連江)$/; // 「花蓮市」等縣轄市一律歸到縣
function cityOf(c){
  const t=(c.city||'')+' '+c.name+' '+(c.addr||'');
  const m=t.replace(/臺/g,'台').match(/(台北|新北|基隆|桃園|新竹|苗栗|台中|彰化|南投|雲林|嘉義|台南|高雄|屏東|宜蘭|花蓮|台東|澎湖|金門|連江)(市|縣)?/);
  if(m)return m[1]+(COUNTY.test(m[1])?'縣':(m[2]||'市'));
  const D={'新北市':/板橋|新店|中和|永和|土城|林口|三重|新莊|汐止|淡水/,'桃園市':/中壢|青埔|蘆竹/,'新竹縣':/竹北/,'苗栗縣':/頭份|竹南/,'台中市':/大里|豐原/,'高雄市':/岡山|鳳山|左營/,'宜蘭縣':/羅東/};
  for(const k in D)if(D[k].test(t))return k;
  return c.region||'其他';
}

/* ---- 版本分類：原始文字各家不同，整理成可篩選的類別 ---- */
const KINDS=['IMAX','4DX','ScreenX','杜比','3D','豪華廳'];
function kindsOf(f){
  f=String(f||'');const k=[];
  if(/IMAX/i.test(f))k.push('IMAX');
  if(/4DX|4D/i.test(f))k.push('4DX');
  if(/SCREEN\s?X/i.test(f))k.push('ScreenX');
  if(/DOLBY|杜比|ATMOS/i.test(f))k.push('杜比');
  if(/3D/i.test(f))k.push('3D');
  if(/GOLD\s?CLASS|\bGC\b|LUXE|皇家|尊爵|VIP|B[．.]?O[．.]?X|MUCROWN|貴賓|頂級|TITAN|DVA/i.test(f))k.push('豪華廳');
  return k;
}

/* ---- 標準化 ---- */
let DB=null, IDX={}, BYM={}, LOAD_ERR='';
function setData(raw){
  const movies=raw.movies||[], shows=raw.showtimes||[];
  // 分級統一成「普／護／輔12／輔15／限」（部分來源寫成「輔12級」）
  movies.forEach(m=>{if(m.rating)m.rating=String(m.rating).replace(/級$/,'').replace('普遍','普').replace('保護','護').replace('輔導','輔').replace('限制','限')});
  const cinemas=(raw.cinemas||[]).map(c=>({...c,_city:cityOf(c)}));
  const ci=c=>{const i=CITY_ORDER.indexOf(c._city);return i<0?99:i};
  cinemas.sort((a,b)=>ci(a)-ci(b)||String(a.chain).localeCompare(String(b.chain),'zh-Hant')||a.name.localeCompare(b.name,'zh-Hant'));
  shows.forEach((s,i)=>{s._i=i;s._k=kindsOf(s.format)});
  IDX={};BYM={};
  for(const s of shows){const k=s.cinema+'|'+s.movie+'|'+s.date;(IDX[k]=IDX[k]||[]).push(s);(BYM[s.movie]=BYM[s.movie]||[]).push(s)}
  for(const k in IDX)IDX[k].sort((a,b)=>tkey(a.time).localeCompare(tkey(b.time)));
  const cities=[...new Set(cinemas.map(c=>c._city))];
  DB={demo:!!raw.demo,updatedAt:raw.updatedAt,status:raw.status||[],chains:[...new Set(cinemas.map(c=>c.chain).filter(Boolean))],cities,movies,cinemas,shows,
    byM:Object.fromEntries(movies.map(m=>[m.id,m])),byC:Object.fromEntries(cinemas.map(c=>[c.id,c]))};
  const maxD=shows.reduce((a,s)=>s.date>a?s.date:a,todayS);
  DB.lastDate=maxD;
  if(S.city!=='全台'&&!cities.includes(S.city))S.city='全台';
}
const showsOf=(c,m,d)=>IDX[c+'|'+m+'|'+d]||[];
const published=(c,d)=>!c.publish?.publishedUntil||d<=c.publish.publishedUntil;

/* ---- 海報：網站自帶 → 官網 → 產生替代圖 ---- */
function posterErr(img){const r=img.dataset.remote;if(r&&img.getAttribute('src')!==r){img.dataset.remote='';img.src=r;return}img.onerror=null;img.src=img.dataset.fb}
function fallbackPoster(m){
  const h=m.hue??(Math.abs([...m.title].reduce((a,c)=>a+c.charCodeAt(0),0))%360);
  const t=[...m.title].slice(0,10).join('');
  const lines=t.length>5?[t.slice(0,Math.ceil(t.length/2)),t.slice(Math.ceil(t.length/2))]:[t];
  const txt=lines.map((l,i)=>`<text x="20" y="${250+i*40}" font-size="32" font-weight="800" fill="#16181d" font-family="sans-serif">${esc(l)}</text>`).join('');
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 360"><rect width="240" height="360" fill="hsl(${h},35%,90%)"/><rect x="20" y="20" width="200" height="190" rx="6" fill="hsl(${h},45%,78%)"/>${txt}<text x="20" y="${lines.length>1?336:300}" font-size="11" fill="#5b6270" font-family="sans-serif">${esc((m.en||'').slice(0,30))}</text></svg>`;
  return 'data:image/svg+xml;utf8,'+encodeURIComponent(svg);
}
function posterImg(m,eager){
  const fb=fallbackPoster(m), src=m.posterLocal||m.poster||fb, remote=m.posterLocal&&m.poster?m.poster:'';
  return `<img referrerpolicy="no-referrer" alt="" ${eager?'':'loading="lazy"'} src="${esc(src)}" onerror="posterErr(this)" data-remote="${esc(remote)}" data-fb="${fb.replace(/"/g,'&quot;')}">`;
}

function pubLine(c){

  if(!favs.length&&!rest.length)html+=`<div class="empty"><b>找不到「${esc(S.cq)}」</b>試試品牌名稱，例如「威秀」。</div>`;
  if(!q&&S.city!=='全台')html+=`<div style="text-align:center;margin-top:16px"><button class="btn" data-setcity="全台">看全台影城</button></div>`;
  view.innerHTML=html+foot();
}

/* 電影頁 */
function pageMovie(id){
  const m=DB.byM[id];
  if(!m){view.innerHTML='<div class="empty"><b>找不到這部電影</b>可能已經下檔。<br><a class="btn" href="#/">回到現正上映</a></div>';sub.innerHTML='';return}
  document.title=m.title+'｜開場';
  const cs=areaCinemas();
  const all=BYM[m.id]||[];
  const areaIds=new Set(cs.map(c=>c.id));
  const dset=new Set(all.filter(s=>areaIds.has(s.cinema)).map(s=>s.date));
  let dates=nextDates();
  const extra=[...dset].filter(d=>!dates.includes(d)&&d>=todayS).sort();
  dates=[...dates,...extra].slice(0,21);
  if(m.status==='soon'&&dset.size&&!dset.has(S.date))S.date=[...dset].sort()[0];
  sub.innerHTML='';
  const facts=[m.rating?m.rating+'級':'',m.runtime?m.runtime+' 分鐘':'',m.genre,m.release?(m.release>todayS?md(m.release)+' 上映':md(m.release)+' 上映'):''].filter(Boolean);
  let html=`<div class="hero"><div class="poster">${posterImg(m,true)}</div><div><h1>${esc(m.title)}</h1>${m.en?`<div class="en">${esc(m.en)}</div>`:''}<div class="facts">${facts.map(f=>`<span class="fact">${esc(f)}</span>`).join('')}</div></div></div>`;
  if(m.synopsis)html+=`<p class="syn" id="syn">${esc(m.synopsis)}</p>${m.synopsis.length>70?'<button class="more" data-act="syn">展開簡介</button>':''}`;
  if(m.status==='soon'&&!m.presale){
    const e=earliestPublish(cs);
    html+=`<div class="sec-h"><h2>場次</h2></div><div class="notice warn">還沒開賣。場次公布後，會出現在「現正上映」${e?`；${esc(S.city)}最快的是 <b>${esc(e.c.name)}</b>，預計 <b>${md(e.n.slice(0,10))}${e.n.includes('T')?' '+e.n.slice(11):''}</b> 公布下一批場次`:''}。</div>`;
    view.innerHTML=html+foot();return;
  }
  const count=d=>cs.reduce((a,c)=>a+showsOf(c.id,m.id,d).length,0);
  html+=`<div class="sec-h" style="margin-bottom:0"><h2>場次</h2><span>${esc(S.city)}</span></div>`;
  html+=dateStrip(dates,count);
  // 這部片在這天有哪些版本
  const dayShows=cs.flatMap(c=>showsOf(c.id,m.id,S.date));
  const kinds=KINDS.filter(k=>dayShows.some(s=>s._k.includes(k)));
  html+=`<div class="fbar">${['晚','早'].map(p=>`<button class="chip" data-period="${p}" aria-pressed="${S.period===p}">${PERIODS[p]}</button>`).join('')}${kinds.map(k=>`<button class="chip" data-kind="${esc(k)}" aria-pressed="${S.kinds.has(k)}">${esc(k)}</button>`).join('')}${S.chains.size?[...S.chains].map(k=>`<button class="chip x" data-unset="chain" data-v="${esc(k)}">${esc(k)} ${ICON.x}</button>`).join(''):''}</div>`;
  // 影城：常用的排前面，其餘依縣市
  let pastN=0;
  const blocks=[];
  for(const c of cs){
    const l=showsOf(c.id,m.id,S.date).filter(showOK);
    const future=l.filter(s=>!isPast(s));pastN+=l.length-future.length;
    const show=S.showPast?l:future;
    if(show.length)blocks.push({c,show});
  }
  blocks.sort((a,b)=>(isFav(b.c.id)-isFav(a.c.id)));
  if(!blocks.length){
    const unpub=cs.length&&cs.every(c=>!published(c,S.date));
    const e=earliestPublish(cs);
    html+=unpub?`<div class="notice warn">${md(S.date)}的場次還沒公布${e?`。最快是 <b>${esc(e.c.name)}</b>，預計 <b>${md(e.n.slice(0,10))}${e.n.includes('T')?' '+e.n.slice(11):''}</b> 公布`:''}。</div>`
      :`<div class="empty"><b>${md(S.date)}${esc(S.city==='全台'?'':S.city)}沒有符合的場次</b>${pastN&&!S.showPast?`今天已開演 ${pastN} 場。`:'換個日期、縣市，或放寬篩選試試。'}${S.city!=='全台'?`<br><button class="btn" data-setcity="全台">改看全台</button>`:''}</div>`;
  }else{
    let lastGroup='';
    for(const {c,show} of blocks){
      const g=isFav(c.id)?'常用影城':(S.city==='全台'?c._city:'');
      if(g&&g!==lastGroup){html+=`<div class="sec-h"><h2>${esc(g)}</h2></div>`;lastGroup=g}
      html+=`<div class="cin"><div class="cin-h"><a class="main" href="#/cinema/${encodeURIComponent(c.id)}"><h3>${esc(c.name)}</h3><div class="sub">${esc(c.chain||'')}・${esc(c._city)}</div></a><button class="star" data-fav="${esc(c.id)}" aria-pressed="${isFav(c.id)}" aria-label="${isFav(c.id)?'移出':'加入'}常用影城">${isFav(c.id)?ICON.star:ICON.starO}</button></div>${groupedTimes(show)}</div>`;
    }
  }
  if(pastN)html+=`<button class="past" data-act="past">${S.showPast?'隱藏已開演的場次':`顯示已開演的 ${pastN} 場`}</button>`;
  view.innerHTML=html+foot();
}

/* 影城頁 */
function pageCinema(id){
  const c=DB.byC[id];
  if(!c){view.innerHTML='<div class="empty"><b>找不到這間影城</b><br><a class="btn" href="#/cinemas">回到影城列表</a></div>';sub.innerHTML='';return}
  document.title=c.name+'｜開場';
  sub.innerHTML='';
  const ms=DB.movies.filter(m=>m.status!=='soon'||m.presale);
  const count=d=>ms.reduce((a,m)=>a+showsOf(c.id,m.id,d).length,0);
  const dates=nextDates(14);
  const map='https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(c.addr&&c.addr.length>6?c.addr:c.name);
  let html=`<div class="cin-h"><div class="main"><h1 style="margin:0;font-size:21px;line-height:1.3">${esc(c.name)}</h1><div class="sub">${esc(c.chain||'')}・${esc(c.addr||c._city)}</div></div><button class="star" data-fav="${esc(c.id)}" aria-pressed="${isFav(c.id)}" aria-label="${isFav(c.id)?'移出':'加入'}常用影城">${isFav(c.id)?ICON.star:ICON.starO}</button></div>
  <div class="links"><a class="btn" href="${esc(map)}" target="_blank" rel="noopener noreferrer">地圖</a><a class="btn" href="${esc(c.site||'#')}" target="_blank" rel="noopener noreferrer">${c.chain==='其他影城'?(/atmovies/.test(c.site||'')?'開眼時刻表':'影城官網'):esc(c.chain||'')+'官網'}</a></div>
  <div style="margin-top:12px">${pubBox(c)}</div>`;
  html+=`<div class="sec-h" style="margin-bottom:0"><h2>場次</h2></div>`+dateStrip(dates,count);
  html+=`<div class="fbar">${['晚','早'].map(p=>`<button class="chip" data-period="${p}" aria-pressed="${S.period===p}">${PERIODS[p]}</button>`).join('')}${KINDS.filter(k=>ms.some(m=>showsOf(c.id,m.id,S.date).some(s=>s._k.includes(k)))).map(k=>`<button class="chip" data-kind="${esc(k)}" aria-pressed="${S.kinds.has(k)}">${esc(k)}</button>`).join('')}</div>`;
  let pastN=0;const rows=[];
  for(const m of ms){const l=showsOf(c.id,m.id,S.date).filter(showOK);const f=l.filter(s=>!isPast(s));pastN+=l.length-f.length;const show=S.showPast?l:f;if(show.length)rows.push({m,show})}
  rows.sort((a,b)=>tkey(a.show[0].time).localeCompare(tkey(b.show[0].time)));
  if(!rows.length){
    html+=!published(c,S.date)?`<div class="notice warn">${md(S.date)}的場次還沒公布。</div>`:`<div class="empty"><b>${md(S.date)}沒有符合的場次</b>${pastN&&!S.showPast?`今天已開演 ${pastN} 場。`:'換個日期或放寬篩選試試。'}</div>`;
  }else{
    html+=`<div class="cin">${rows.map(({m,show})=>`<div class="cin-l"><a class="poster" href="#/movie/${encodeURIComponent(m.id)}" aria-label="${esc(m.title)}">${posterImg(m)}</a><div class="main"><h3><a href="#/movie/${encodeURIComponent(m.id)}" style="text-decoration:none">${esc(m.title)}</a> ${m.rating?`<span class="fact" style="font-size:11px;padding:0 5px">${esc(m.rating)}</span>`:''}</h3>${groupedTimes(show)}</div></div>`).join('')}</div>`;
  }
  if(pastN)html+=`<button class="past" data-act="past">${S.showPast?'隱藏已開演的場次':`顯示已開演的 ${pastN} 場`}</button>`;
  view.innerHTML=html+foot();
}

function foot(){return `<div class="foot">場次整理自各影城官網，每天早上更新一次，訂票前請以官網為準。<br><button data-act="about">資料來源與更新狀態</button></div>`}

function searchSheet(){

function searchResults(){
  const box=$('#qr');if(!box)return;
  const q=S.q.trim().toLowerCase();
  if(!q){box.innerHTML='<div class="note">輸入片名或影城名稱，例如「柯南」或「信義」。</div>';return}
  const norm=s=>String(s||'').toLowerCase().replace(/[\s：:，,。.!！?？《》「」]/g,'');
  const nq=norm(q);
  const ms=DB.movies.filter(m=>(m.status!=='soon'||true)&&(norm(m.title).includes(nq)||norm(m.en).includes(nq))&&(BYM[m.id]||m.status==='soon')).slice(0,12);
  const cs=DB.cinemas.filter(c=>norm(c.name+c.chain).includes(nq)).slice(0,10);
  let h='';
  if(ms.length)h+=`<h4>電影</h4><div class="list">${ms.map(m=>`<a class="row" href="#/movie/${encodeURIComponent(m.id)}" data-act="close-nav" style="text-decoration:none"><div class="poster" style="width:40px;border-radius:5px">${posterImg(m)}</div><div class="main"><h3>${esc(m.title)}</h3><div class="sub">${m.status==='soon'?md(m.release)+' 上映':esc(m.en||metaLine(m))}</div></div></a>`).join('')}</div>`;
  if(cs.length)h+=`<h4>影城</h4><div class="list">${cs.map(c=>`<a class="row" href="#/cinema/${encodeURIComponent(c.id)}" data-act="close-nav" style="text-decoration:none"><div class="main"><h3>${esc(c.name)}</h3><div class="sub">${esc(c.chain)}・${esc(c._city)}</div></div></a>`).join('')}</div>`;
  box.innerHTML=h||`<div class="empty"><b>找不到「${esc(S.q)}」</b>試試片名中的其他字，或英文片名。</div>`;
}
const DIRECT={'秀泰':1,'威秀':1,'新光':1,'美麗華':1,'樂聲':1};
function ticketUrl(c,m,s){const t=s.url||c.ticketUrl||c.site||'#';return t.replace('{movie}',encodeURIComponent(m.id)).replace('{date}',s.date).replace('{time}',encodeURIComponent(s.time))}
function ticketSheet(i){
  const s=DB.shows[i],c=DB.byC[s.cinema],m=DB.byM[s.movie];

  const other=c.chain==='其他影城'; // 由開眼取得的獨立影城：連到該影城官網（沒有官網時連開眼時刻表）
  const who=other?c.name:(c.chain||'官網');

  openSheet(`<h2>${esc(m.title)}</h2><div class="sum"><div><span>影城</span><b>${esc(c.name)}</b></div><div><span>時間</span><b>${md(s.date)} ${esc(s.time)}</b></div>${s.format||s.hall?`<div><span>版本／廳</span><b>${[s.format,s.hall].filter(Boolean).map(esc).join('・')}</b></div>`:''}${s.seats==='low'?'<div><span>座位</span><b style="color:var(--warn)">剩不多</b></div>':''}</div>
  <a class="btn pri block" href="${esc(ticketUrl(c,m,s))}" target="_blank" rel="noopener noreferrer">${viaAt?'查看這間影城的時刻表':'到'+esc(who)+(other?'官網':'')+'訂票'}</a>
  <div class="note">${direct?'會直接打開這個場次的訂票頁。':viaAt?'這間影城沒有線上訂票網站，可到現場購票或來電詢問。':`${esc(who)}官網沒有單一場次的連結，打開後請再選一次 ${md(s.date)} ${esc(s.time)} 這場。`}${other?'場次資料來自開眼電影網。':''}票價、座位以官網為準。</div>
  <div class="sheet-foot"><button class="btn" data-act="close">返回場次</button></div>`,'訂票');

function aboutSheet(){
  openSheet(`<h2>資料來源與更新狀態</h2>
  <div class="note" style="margin:0 0 12px">${DB.demo?'目前顯示示範內容。':'每天早上 8 點自動到各影城官網抓取場次。'}${DB.updatedAt&&!DB.demo?'最近一次：'+fmtTime(DB.updatedAt)+'。':''}「下次公布」標示「官方」的是影城自己公告的時間，其他是依過去規律推估。</div>
  ${DB.status.length?`<div class="sum">${DB.status.map(x=>`<div><span>${esc(x.chain)}</span><b style="color:${x.ok?'var(--ok)':'var(--red)'}">${x.ok?(x.shows?x.shows+' 場':'正常'):'更新失敗，顯示前次資料'}</b></div>`).join('')}</div>`:''}
  <div class="sheet-foot"><button class="btn" data-act="reload">重新載入</button><button class="btn pri" data-act="close">關閉</button></div>
  <details><summary>載入自己的場次檔（測試用）</summary><textarea id="pasteBox" aria-label="貼上 JSON" placeholder='{"movies":[],"cinemas":[],"showtimes":[]}'></textarea><div class="sheet-foot" style="margin-top:8px"><button class="btn" id="loadPaste">載入貼上的內容</button><label class="btn" style="cursor:pointer">選擇檔案<input id="fileIn" type="file" accept="application/json,.json" hidden></label></div></details>`,'資料來源');

function toast(t){document.querySelectorAll('.toast').forEach(e=>e.remove());const e=document.createElement('div');e.className='toast';e.setAttribute('role','status');e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),2400)}
function loadJSON(txt){
  try{const j=JSON.parse(txt);if(!Array.isArray(j.movies)||!Array.isArray(j.cinemas)||!Array.isArray(j.showtimes))throw new Error('缺少 movies、cinemas 或 showtimes');

  }catch(e){toast('載入失敗：'+e.message)}

/* ================= 路由與繪製 ================= */
function parseRoute(){
  const h=location.hash.replace(/^#\/?/,'');const [r,id]=h.split('/');
  S.route=({cinemas:'cinemas',soon:'soon',movie:'movie',cinema:'cinema'})[r]||'now';
  S.id=id?decodeURIComponent(id):null;
}
function render(keepScroll){
  if(!DB)return;
  const y=window.scrollY;
  document.title='開場｜全台電影場次';
  bar.innerHTML=topBar();
  document.querySelectorAll('.tabbar a').forEach(a=>{if(a.dataset.nav===S.route)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});
  if(S.route==='now')pageNow();else if(S.route==='soon')pageSoon();else if(S.route==='cinemas')pageCinemas();else if(S.route==='movie')pageMovie(S.id);else pageCinema(S.id);
  if(keepScroll)window.scrollTo(0,y);
  const sel=sub.querySelector('.d[aria-pressed=true]')||view.querySelector('.d[aria-pressed=true]');
  if(sel){const p=sel.parentElement;p.scrollLeft=Math.max(0,sel.offsetLeft-p.clientWidth/2+sel.offsetWidth/2)}
}
const rerender=()=>{render(true);if(sheetOpen&&layer.querySelector('[aria-label="篩選場次"]'))filterSheetRefresh()};
// 面板已開著時重畫內容（不會多一筆返回紀錄）
function filterSheetRefresh(){const sh=layer.querySelector('.sheet');const y=sh?sh.scrollTop:0;filterSheet();const n=layer.querySelector('.sheet');if(n)n.scrollTop=y}

// 記住每一頁的捲動位置，返回時回到原處
const scrollMem={};let curHash=location.hash,navCount=0,scrollT=0;
window.addEventListener('scroll',()=>{clearTimeout(scrollT);scrollT=setTimeout(()=>{scrollMem[curHash]=window.scrollY},80)},{passive:true});
window.addEventListener('hashchange',()=>{
  navCount++;parseRoute();
  if(sheetOpen){layer.innerHTML='';document.body.style.overflow='';sheetOpen=false}
  curHash=location.hash;render();window.scrollTo(0,scrollMem[curHash]||0);
});
// 手機返回鍵：有面板時先關面板；自己呼叫 history.back() 產生的事件略過
window.addEventListener('popstate',()=>{if(ignorePop){ignorePop--;return}if(sheetOpen&&!history.state?.sheet)closeSheet(true)});

document.addEventListener('click',e=>{
  const t=e.target.closest('button,a,label');if(!t)return;
  const d=t.dataset;
  if(d.act==='close-nav'){if(sheetOpen){layer.innerHTML='';document.body.style.overflow='';sheetOpen=false;e.preventDefault();history.replaceState(null,'',t.getAttribute('href'));parseRoute();render();window.scrollTo(0,0)}return}
  if(d.date){S.date=d.date;S.showPast=false;return render(true)}
  if(d.period){S.period=S.period===d.period?'全部':d.period;return rerender()}
  if(d.kind){S.kinds.has(d.kind)?S.kinds.delete(d.kind):S.kinds.add(d.kind);return rerender()}
  if(d.chain){S.chains.has(d.chain)?S.chains.delete(d.chain):S.chains.add(d.chain);return rerender()}
  if(d.unset){if(d.unset==='period')S.period='全部';if(d.unset==='kind')S.kinds.delete(d.v);if(d.unset==='chain')S.chains.delete(d.v);return render(true)}
  if(d.setcity){S.city=d.setcity;store.set('city',S.city);store.set('askedCity',true);if(sheetOpen)closeSheet();return render()}
  if(d.fav){toggleFav(d.fav);return render(true)}
  if(d.show){return ticketSheet(+d.show)}
  switch(d.act){
    case 'back':return navCount>0?history.back():(location.hash=S.route==='cinema'?'#/cinemas':'#/');
    case 'loc':return locSheet();
    case 'search':return searchSheet();
    case 'filters':return filterSheet();
    case 'clear':S.period='全部';S.kinds.clear();S.chains.clear();render(true);if(sheetOpen)filterSheetRefresh();return;
    case 'close':return closeSheet();
    case 'past':S.showPast=!S.showPast;return render(true);
    case 'syn':{const p=$('#syn');p.classList.toggle('open');t.textContent=p.classList.contains('open')?'收合簡介':'展開簡介';return}
    case 'about':return aboutSheet();
    case 'reload':if(sheetOpen)closeSheet();return boot(true);
  }
  if(t.id==='loadPaste')return loadJSON($('#pasteBox').value);
});
document.addEventListener('input',e=>{
  if(e.target.id==='q'){S.q=e.target.value;searchResults()}
  if(e.target.id==='cq'){S.cq=e.target.value;renderCinemaList()}
});
document.addEventListener('change',e=>{if(e.target.id==='fileIn'&&e.target.files[0]){const r=new FileReader();r.onload=()=>loadJSON(r.result);r.readAsText(e.target.files[0])}});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&sheetOpen)closeSheet();
  if(e.key==='Enter'&&e.target.id==='q'){e.preventDefault();e.target.blur()} // 按「搜尋」收起鍵盤看結果
});

function fmtTime(iso){const d=new Date(iso);if(isNaN(d))return '';return (d.getMonth()+1)+'/'+d.getDate()+' '+pad(d.getHours())+':'+pad(d.getMinutes())}
async function boot(force){
  parseRoute();
  if(!DB){bar.innerHTML=`<div class="brand"><img src="icon-192.png" alt="" width="30" height="30"><div>開場<small>全台電影場次</small></div></div>`;view.innerHTML=`<div class="grid">${Array.from({length:6},()=>'<div><div class="skel" style="aspect-ratio:2/3"></div><div class="skel" style="height:14px;margin-top:8px;width:80%"></div></div>').join('')}</div>`}
  try{
    const r=await fetch('data.json'+(force?'?t='+Date.now():''),{cache:'no-cache'});
    if(!r.ok)throw new Error('HTTP '+r.status);
    const j=await r.json();
    if(!Array.isArray(j.showtimes)||!j.showtimes.length)throw new Error('資料是空的');
    LOAD_ERR='';setData(j);if(force)toast('已載入最新場次');
  }catch(e){LOAD_ERR=e.message;setData(demoData())}
  render();
}
boot();
</script>
</body>
</html>
