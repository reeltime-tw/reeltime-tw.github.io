<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<!-- 隱私保護：這個網頁只能向自己的網站、以及 Reeltime 推播伺服器（只在使用者開啟推播時，送出追蹤條件與推播位址）連線，瀏覽器會擋下其他任何對外連線（位置不可能被送出去） -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://reeltime-push.reeltime-tw.workers.dev; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="color-scheme" content="light">
<title>Reeltime｜全台電影場次</title>
<meta name="description" content="全台影城場次一次看，選好場次直接到官網訂票。">
<meta name="application-name" content="Reeltime">
<meta name="apple-mobile-web-app-title" content="Reeltime">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<style>
/* Barlow Condensed（SIL OFL）放在自己的網站，不連 Google */
@font-face{font-family:"Barlow Condensed";font-weight:500;font-display:swap;src:url(fonts/barlow-condensed-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow Condensed";font-weight:600;font-display:swap;src:url(fonts/barlow-condensed-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow Condensed";font-weight:700;font-display:swap;src:url(fonts/barlow-condensed-latin-700-normal.woff2) format("woff2")}
:root{
  --bg:#f5f6f8; --surface:#ffffff; --ink:#16181d; --ink2:#5b6270; --ink3:#636a78; --line:#e2e5ea; --line2:#eef0f3;
  --red:#b3122e; --red-soft:#fbeef0; --ok:#1f7a4d; --ok-soft:#e8f4ee; --warn:#9a5208; --warn-soft:#fdf3e6;
  --num:"Barlow Condensed","Arial Narrow",sans-serif;
  --hd:52px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:150px}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;line-height:1.55;font-size:15px}
body{padding-bottom:calc(68px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
a{color:inherit}
:focus-visible{outline:2px solid var(--red);outline-offset:2px;border-radius:6px}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---- 頂部 ---- */
header{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.96);backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.bar{height:var(--hd);display:flex;align-items:center;gap:8px}
.brand{display:flex;align-items:center;gap:9px;white-space:nowrap;margin-right:auto;line-height:1.15}
.brand img{border-radius:8px;flex:0 0 auto}
.brand .bn{display:block;font-family:var(--num);font-weight:700;font-size:25px;letter-spacing:.3px;line-height:1.05}
.brand small{display:block;font-weight:400;font-size:12px;color:var(--ink3);letter-spacing:0;line-height:1.3}
.brand small.stale{color:var(--warn);font-weight:600}
.loc{display:flex;align-items:center;gap:4px;height:36px;padding:0 12px;border-radius:18px;background:var(--bg);border:1px solid var(--line);font-size:14px;font-weight:600;white-space:nowrap}
.loc svg{width:16px;height:16px;color:var(--red)}
.ibtn{width:40px;height:40px;border-radius:20px;display:grid;place-items:center;color:var(--ink2)}
.ibtn:hover{background:var(--bg)}
.ibtn svg{width:21px;height:21px}
.back{display:flex;align-items:center;gap:2px;height:40px;padding-right:10px;margin-left:-8px;font-size:15px;color:var(--ink)}
.back svg{width:24px;height:24px}

/* ---- 日期列 ---- */
.dates{display:flex;gap:6px;overflow-x:auto;padding:8px 16px 10px;margin:0 -16px;scrollbar-width:none}
.dates::-webkit-scrollbar{display:none}
.d{flex:0 0 auto;width:52px;padding:5px 0 6px;border-radius:12px;border:1px solid transparent;display:flex;flex-direction:column;align-items:center;color:var(--ink2);font-size:12px;line-height:1.2}
.d b{font-family:var(--num);font-size:24px;font-weight:600;color:var(--ink);line-height:1.05;margin-top:2px}
.d.none{opacity:.38}
.d:hover{border-color:var(--line)}
.d[aria-pressed=true]{background:var(--ink);color:#fff}
.d[aria-pressed=true] b{color:#fff}

/* ---- 篩選列 ---- */
.fbar{display:flex;gap:6px;overflow-x:auto;padding:0 16px 10px;margin:0 -16px;scrollbar-width:none}
.fbar::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;display:inline-flex;align-items:center;gap:4px;height:34px;padding:0 13px;border-radius:17px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:14px;white-space:nowrap}
.chip svg{width:16px;height:16px}
.chip[aria-pressed=true]{background:var(--red-soft);border-color:var(--red);color:var(--red);font-weight:600}
.chip .n{min-width:18px;height:18px;border-radius:9px;background:var(--red);color:#fff;font-size:12px;display:inline-grid;place-items:center;padding:0 5px}
.chip.x{background:var(--red-soft);border-color:transparent;color:var(--red)}

main{padding:14px 0 24px;min-height:60vh}
#sub .fbar{padding-bottom:8px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:22px 0 10px}
.sec-h:first-child{margin-top:4px}
.sec-h h2{margin:0;font-size:17px}
.sec-h span{font-size:13px;color:var(--ink3)}

/* ---- 電影格 ---- */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 10px}
@media(min-width:360px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(min-width:600px){.grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:18px 12px}}
.mv{display:block;text-align:left;width:100%;text-decoration:none;color:inherit}
.cin-h a,.row a{color:inherit}
.poster{position:relative;aspect-ratio:2/3;border-radius:10px;overflow:hidden;background:var(--line2)}
.poster img{width:100%;height:100%;object-fit:cover;display:block}
.mv:hover .poster img{transform:scale(1.02)}
.poster img{transition:transform .25s}
@media(prefers-reduced-motion:reduce){.poster img{transition:none}}
.rt{position:absolute;right:6px;top:6px;min-width:26px;height:20px;padding:0 5px;border-radius:5px;font-size:12px;font-weight:700;display:grid;place-items:center;color:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.rt-普{background:#2b8a3e}.rt-護{background:#1c64c4}.rt-輔12{background:#e3b505;color:#3a2d00}.rt-輔15{background:#e8590c}.rt-限{background:#c92a2a}
.flag{position:absolute;left:0;bottom:0;right:0;padding:16px 8px 6px;background:linear-gradient(transparent,rgba(0,0,0,.72));color:#fff;font-size:12px;font-weight:600}
.mv h3{margin:6px 0 0;font-size:14px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mv p{margin:2px 0 0;font-size:12px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mv p b{font-family:var(--num);font-size:15px;font-weight:600;color:var(--red);margin:0 1px 0 3px;letter-spacing:0}
.grid .rt{right:4px;top:4px;min-width:22px;height:18px;font-size:12px}
.grid .flag{padding:14px 6px 4px;font-size:12px}

/* ---- 列表 ---- */
.list{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:0 1px 2px rgba(22,24,29,.06)}
.row{display:flex;align-items:center;gap:10px;padding:12px 14px;width:100%;text-align:left;border-top:1px solid var(--line2)}
.row:first-child{border-top:0}
.row:hover{background:#fafbfc}
.row .main{flex:1;min-width:0}
.row h3{margin:0;font-size:15.5px;line-height:1.35}
.row .sub{font-size:13px;color:var(--ink2)}
.row .side{text-align:right;font-size:12px;color:var(--ink3);white-space:nowrap}
.row .side b{display:block;font-family:var(--num);font-size:22px;font-weight:600;color:var(--ink);line-height:1}
.star{width:40px;height:40px;flex:0 0 auto;display:grid;place-items:center;border-radius:20px;color:var(--ink3)}
.star svg{width:21px;height:21px}
.star[aria-pressed=true]{color:#e0a400}
.star:hover{background:var(--bg)}
.publine{font-size:12px;color:var(--ink3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.publine .ok{color:var(--ok)}
.row .side small{display:block;font-size:12px;color:var(--ink3)}
.row .side.none{font-size:12px;white-space:nowrap}

/* ---- 電影頁 ---- */
.hero{display:flex;gap:14px;align-items:flex-start}
.hero .poster{width:88px;flex:0 0 auto;border-radius:10px}
.hero h1{margin:0;font-size:20px;line-height:1.3}
.hero .watch{margin-top:10px;height:36px;padding:0 14px;font-size:14px}
svg.bell{width:18px;height:18px;flex:0 0 auto}
.btn.on{background:var(--red-soft);border-color:var(--red);color:var(--red)}
.hero .en{font-size:13px;color:var(--ink3);margin-top:2px}
.facts{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.fact{font-size:12px;padding:2px 8px;border-radius:6px;background:var(--bg);border:1px solid var(--line);color:var(--ink2)}
.syn{font-size:14px;color:var(--ink2);margin:10px 0 0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.syn.open{display:block}
.more{font-size:13px;color:var(--red);margin-top:2px;padding:4px 0}

.cin{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px 14px;margin-bottom:10px;box-shadow:0 1px 2px rgba(22,24,29,.06)}
.cin-h{display:flex;align-items:flex-start;gap:6px}
.cin-h .main{flex:1;min-width:0}
.cin-h h3{margin:0;font-size:16px;line-height:1.35}
.cin-h a{text-decoration:none}
.cin-h .sub{font-size:13px;color:var(--ink2)}
.cin .star{margin:-6px -8px 0 0}
.cin.fold .cin-h{align-items:center}
.cin .tog{all:unset;flex:1;min-width:0;cursor:pointer;display:block}
.cin .tog:focus-visible{outline:2px solid var(--red);outline-offset:4px;border-radius:6px}
.cin .chev{width:20px;height:20px;color:var(--ink2);flex:0 0 auto;transition:transform .15s}
.cin .chev svg{width:20px;height:20px}
.cin.open .chev{transform:rotate(180deg)}
.cin .peek{display:flex;gap:8px;align-items:baseline;margin-top:6px;font-size:14px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cin .peek b{color:var(--red);font-weight:600;flex:0 0 auto}
.cin .peek span{font-family:'Barlow Condensed',system-ui,sans-serif;font-size:16px;letter-spacing:.3px;color:var(--ink);overflow:hidden;text-overflow:ellipsis}
.cin .peek-f{font-size:12px;color:var(--ink2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cin-tools{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;color:var(--ink2);margin:10px 2px 8px}
.lnk{all:unset;cursor:pointer;color:var(--red);font-size:14px;font-weight:600;padding:6px 2px}
.cin-more{display:inline-block;margin-top:8px;text-decoration:none}
@media(prefers-reduced-motion:reduce){.cin .chev{transition:none}}
.fg{margin-top:10px}
.fg-l{font-size:13px;color:var(--ink2);margin-bottom:6px}
.stubs{display:flex;flex-wrap:wrap;gap:8px}
.past{font-size:13px;color:var(--ink3);margin-top:10px;padding:4px 0}

/* 票根：左右半圓缺口 */
.stub{--c:var(--surface);position:relative;min-width:76px;padding:6px 12px 5px;text-align:center;background:
  radial-gradient(circle at 0 50%,transparent 5px,var(--c) 5.5px) left/51% 100% no-repeat,
  radial-gradient(circle at 100% 50%,transparent 5px,var(--c) 5.5px) right/51% 100% no-repeat;
  filter:drop-shadow(0 0 .6px rgba(22,24,29,.55)) drop-shadow(0 1px 1px rgba(22,24,29,.08));border-radius:7px}
.stub b{display:block;font-family:var(--num);font-size:23px;font-weight:600;line-height:1.05;letter-spacing:.3px}
.stub span{display:block;font-size:12px;color:var(--ink3);line-height:1.3}
.stub:hover{--c:var(--red-soft)}
.stub:hover b{color:var(--red)}
.stub.low span{color:var(--warn)}
.stub.out{opacity:.5}
.stub.out b{text-decoration:line-through}

.cin-l{display:flex;gap:12px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line2)}
.cin-l:first-of-type{border-top:0;padding-top:0}
.cin-l .poster{width:56px;flex:0 0 auto;border-radius:6px}
.cin-l .main{flex:1;min-width:0}
.cin-l h3{margin:0 0 2px;font-size:15px}
.cin-l h3 button{text-align:left}

.notice{border-radius:12px;padding:12px 14px;font-size:14px;background:var(--surface);border:1px solid var(--line)}
.notice b{font-weight:700}
.notice.warn{background:var(--warn-soft);border-color:#f2dcbf}
.pubbox{display:grid;gap:4px;font-size:13.5px;color:var(--ink2)}
.pubbox b{color:var(--ink)}
.tag{display:inline-block;font-size:12px;padding:0 6px;border-radius:4px;margin-left:4px;vertical-align:1px}
.tag.ok{background:var(--ok-soft);color:var(--ok)}
.tag.est{background:var(--bg);color:var(--ink3);border:1px solid var(--line)}

.empty{text-align:center;padding:40px 16px;color:var(--ink2);font-size:14px}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:6px}
.empty .btn{margin-top:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:44px;padding:0 18px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:14.5px;text-decoration:none}
.btn.pri{background:var(--red);border-color:var(--red);color:#fff}
.btn.block{display:flex;width:100%}
.links{display:flex;gap:8px;margin-top:12px}
.links .btn{flex:1;height:40px;font-size:13.5px}

.search{display:flex;align-items:center;gap:8px;height:44px;padding:0 12px;border-radius:12px;background:var(--surface);border:1px solid var(--line)}
.search svg{width:18px;height:18px;color:var(--ink3);flex:0 0 auto}
.search input{flex:1;border:0;outline:0;background:none;font:inherit;font-size:16px;color:var(--ink);min-width:0}

.foot{text-align:center;font-size:13px;color:var(--ink3);margin-top:28px}
.foot button{color:var(--ink2);text-decoration:underline;font-size:13px}
.banner{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:12px;background:var(--surface);border:1px solid var(--line);margin-bottom:14px;font-size:14px}
.banner svg{width:22px;height:22px;color:var(--red);flex:0 0 auto}
.banner .main{flex:1}
.banner.demo{background:var(--warn-soft);border-color:#f2dcbf;color:var(--warn)}

/* ---- 底部分頁 ---- */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(255,255,255,.97);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabbar .in{max-width:760px;margin:0 auto;display:flex}
.tabbar a{position:relative;flex:1;height:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;color:var(--ink3);text-decoration:none}
.tabbar .bdg{position:absolute;top:5px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--red);color:#fff;font-size:12px;font-style:normal;font-weight:700;display:grid;place-items:center;line-height:1}
.tabbar a[aria-current=page]{color:var(--red);font-weight:600}
.tabbar svg{width:23px;height:23px}
.tabbar .bdg[hidden]{display:none}

/* ---- 底部彈出面板 ---- */
.ov{position:fixed;inset:0;z-index:50;background:rgba(22,24,29,.42);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:760px;max-height:90vh;overflow:auto;background:var(--surface);border-radius:20px 20px 0 0;padding:8px 16px calc(20px + env(safe-area-inset-bottom));animation:up .2s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:0}}
@media(prefers-reduced-motion:reduce){.sheet{animation:none}}
/* 搜尋：從上方展開的全螢幕畫面，輸入框固定在頂端，手機鍵盤不會擋住 */
.ov.top{align-items:flex-start;background:var(--bg)}
.sheet.full{height:100%;max-height:none;border-radius:0;padding:calc(8px + env(safe-area-inset-top)) 16px 24px;background:var(--bg);animation:down .18s ease-out}
@keyframes down{from{transform:translateY(-12px);opacity:0}}
@media(prefers-reduced-motion:reduce){.sheet.full{animation:none}}
.qhead{position:sticky;top:calc(-8px - env(safe-area-inset-top));z-index:2;display:flex;align-items:center;gap:8px;padding:8px 0 10px;background:var(--bg)}
.qhead .search{flex:1}
.qhead .cancel{height:44px;padding:0 4px 0 8px;font-size:15px;color:var(--red);white-space:nowrap}
.grab{width:38px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 10px}
.sheet h2{margin:4px 0 12px;font-size:18px}
.sheet h4{margin:18px 0 8px;font-size:14px;color:var(--ink2);font-weight:600}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.leave{border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:12px 0;background:var(--surface)}
.leave.busy{opacity:.6}
.lv-h{display:flex;align-items:center;gap:6px;font-size:14px}.lv-h svg{width:18px;height:18px;color:var(--red)}.lv-h span{margin-left:auto;font-size:12px;color:var(--ink3);border:1px solid var(--line);border-radius:6px;padding:0 6px}
.lv-big{display:flex;align-items:baseline;gap:8px;margin:8px 0 2px}.lv-big b{font-family:var(--num);font-size:40px;line-height:1;color:var(--red);font-weight:700}.lv-big span{font-size:15px;color:var(--ink2)}
.lv-sub{font-size:13px;color:var(--ink2);line-height:1.5}.lv-late{color:var(--red);font-weight:600}
.lv-note{font-size:14px;line-height:1.55;margin:8px 0}
.lv-row{display:flex;align-items:center;gap:10px;margin-top:10px}.lv-row>span{font-size:12px;color:var(--ink2);flex:0 0 3.2em}
.chip.sm{height:30px;padding:0 10px;font-size:13px}
.maps{display:flex;gap:8px;margin-top:12px}.maps .btn{flex:1;height:48px;font-size:14px;line-height:1.15}.maps .btn span{display:grid;text-align:left}.maps small{font-size:12px;font-weight:500;color:var(--ink2)}.maps svg{width:16px;height:16px}
.leave .btn svg{width:18px;height:18px;flex:0 0 auto}
.lv-row .opts{gap:6px}
.lv-sel{position:relative;display:inline-flex;align-items:center}
.lv-sel select{appearance:none;-webkit-appearance:none;height:34px;padding:0 30px 0 12px;border:1px solid var(--line);border-radius:17px;background:var(--surface);font:inherit;font-size:14px;color:var(--ink)}
.lv-sel svg{position:absolute;right:9px;width:16px;height:16px;pointer-events:none;color:var(--ink2)}
.lv-hint{font-size:12px;color:var(--ink3)!important;flex:1 1 auto!important}
.lv-tiny{font-size:12px;color:var(--ink3);margin-top:6px;line-height:1.5}
.btn.block{width:100%}
.dist{color:var(--ink)}
.geo-card{display:flex;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0 14px}
.geo-card>svg{width:22px;height:22px;color:var(--red);flex:0 0 auto;margin-top:2px}
.geo-card .main{flex:1;min-width:0}.geo-card p{margin:4px 0 10px;font-size:13px;line-height:1.55;color:var(--ink2)}.geo-card p b{color:var(--ink)}
.geo-card .row2{display:flex;gap:8px;flex-wrap:wrap}.geo-card .lnk{margin-top:6px;font-size:13px}
.pv{margin:0;padding-left:20px;font-size:14px;line-height:1.65;color:var(--ink)}.pv li{margin:2px 0}.pv a{color:var(--red)}
.foot button+button{margin-left:2px}

<script src="watch-core.js"></script>
<script>
/* ================= 資料格式 =================
 * {
 *  "updatedAt":"ISO 時間", "status":[{chain,ok,shows}],
 *  "movies":[{"id","title","en","rating","runtime","genre","release":"YYYY-MM-DD","status":"now|soon","presale","synopsis","poster","posterLocal"}],
 *  "cinemas":[{"id","chain","name","region","city","addr","site","ticketUrl",
 *     "publish":{"publishedUntil","nextAt":"YYYY-MM-DDTHH:mm","rangeFrom","rangeTo","official|estimated","presale"}}],
 *  "showtimes":[{"cinema","movie","date","time","format","hall","seats":"open|low|out","url"}]
 * }
 */
const WD=['日','一','二','三','四','五','六'];
const REGION_ORDER=['北部','中部','南部','東部','離島'];
const CITY_ORDER=['台北市','新北市','基隆市','桃園市','新竹市','新竹縣','宜蘭縣','苗栗縣','台中市','彰化縣','南投縣','雲林縣','嘉義市','嘉義縣','台南市','高雄市','屏東縣','花蓮縣','台東縣','澎湖縣','金門縣','連江縣'];
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const parseYmd=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const md=s=>{if(!s)return '';const d=parseYmd(s.slice(0,10));return (d.getMonth()+1)+'/'+d.getDate()+'（'+WD[d.getDay()]+'）'};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const TODAY=new Date(); TODAY.setHours(0,0,0,0);
const todayS=ymd(TODAY), tomorrowS=ymd(addDays(TODAY,1));
const nowHM=()=>{const d=new Date();return pad(d.getHours())+':'+pad(d.getMinutes())};
// 影城把凌晨 0–3 點的午夜場列在前一天，排序時當成 24–27 點
const tkey=t=>{const h=+t.slice(0,2);return String(h<4?h+24:h).padStart(2,'0')+t.slice(2)};
const dayName=s=>s===todayS?'今天':s===tomorrowS?'明天':'週'+WD[parseYmd(s).getDay()];
const store={get(k,d){try{const v=localStorage.getItem('twc.'+k);return v==null?d:JSON.parse(v)}catch{return d}},set(k,v){try{localStorage.setItem('twc.'+k,JSON.stringify(v))}catch{}}};
const ICON={
  clock:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  pin:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s7-6.2 7-12a7 7 0 1 0-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="9" r="2.5"/></svg>',
  search:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>',
  back:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',
  down:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>',
  filter:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M7 12h10M10 18h4"/></svg>',
  star:'<svg viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M12 3.5l2.6 5.3 5.8.8-4.2 4.1 1 5.8-5.2-2.7-5.2 2.7 1-5.8-4.2-4.1 5.8-.8z"/></svg>',
  starO:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M12 3.5l2.6 5.3 5.8.8-4.2 4.1 1 5.8-5.2-2.7-5.2 2.7 1-5.8-4.2-4.1 5.8-.8z"/></svg>',
  x:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  bell:'<svg class="bell" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 8 3 8H3s3-1 3-8"/><path d="M10.3 20a2 2 0 0 0 3.4 0"/></svg>',
};

/* ---- 縣市（舊資料沒有縣市時，從店名推斷）---- */
// 縣市推斷規則放在 watch-core.js，頁面和背景程式（追蹤通知）共用同一份
const cityOf=c=>WatchCore.cityOf(c);

/* ---- 版本分類：原始文字各家不同，整理成可篩選的類別 ---- */
const KINDS=['IMAX','4DX','ScreenX','杜比','3D','豪華廳'];
function kindsOf(f){
  f=String(f||'');const k=[];
  if(/IMAX/i.test(f))k.push('IMAX');
  if(/4DX|4D/i.test(f))k.push('4DX');
  if(/SCREEN\s?X/i.test(f))k.push('ScreenX');
  if(/DOLBY|杜比|ATMOS/i.test(f))k.push('杜比');
  if(/3D/i.test(f))k.push('3D');
  if(/GOLD\s?CLASS|\bGC\b|LUXE|皇家|尊爵|VIP|B[．.]?O[．.]?X|MUCROWN|貴賓|頂級|TITAN|DVA/i.test(f))k.push('豪華廳');
  return k;
}

// 語言／配音：從各家版本文字判斷（國語＝中文配音版與華語片）。沒標示語言的場次不會被歸類
const LANGS=['國語','英語','日語','韓語','粵語'];
function langsOf(f){
  f=String(f||'');const l=[];
  if(/國|中文|華語|CHI\b/i.test(f))l.push('國語');
  if(/英|ENG\b/i.test(f))l.push('英語');
  if(/日|JPN\b/i.test(f))l.push('日語');
  if(/韓|KOR\b/i.test(f))l.push('韓語');
  if(/粵|CANT/i.test(f))l.push('粵語');
  return l;
}

/* ---- 示範資料（只在讀不到 data.json 時使用）---- */
function demoData(){
  const M=(id,title,en,rating,runtime,genre,off,status,synopsis,hue)=>({id,title,en,rating,runtime,genre,release:ymd(addDays(TODAY,off)),status,synopsis,hue});
  const movies=[M('m1','星海歸途','Return Across Stars','護',148,'科幻',-12,'now','太空站失聯十年後，唯一的倖存者帶著一段訊號回到地球。',255),M('m2','雨巷','Rain Alley','輔12',112,'劇情',-20,'now','老城雨巷裡，兩個陌生人因同一把傘展開十年的牽掛。',200),M('m3','最後一班夜車','Last Night Train','輔15',104,'驚悚',-6,'now','末班車上乘客一個個消失。',350),M('m4','熊貓郵局','Panda Post Office','普',96,'動畫',-27,'now','山城郵局的熊貓郵差要送一封遲到三十年的信。',140),M('s1','春日迷宮','Spring Maze','普',107,'奇幻',5,'soon','每天都在改變格局的校園。',320),M('s2','夜航','Night Flight','輔12',122,'劇情',9,'soon','跨洋夜航班機上三個人的人生交會。',230)];
  const cinemas=[['c1','威秀','台北信義威秀影城','北部','台北市'],['c2','國賓','國賓影城 西門','北部','台北市'],['c3','秀泰','台中文心秀泰影城','中部','台中市'],['c4','新光','新光影城 台南','南部','台南市']].map(([id,chain,name,region,city])=>({id,chain,name,region,city,site:'#',publish:{publishedUntil:ymd(addDays(TODAY,3)),nextAt:ymd(addDays(TODAY,1)),rangeFrom:ymd(addDays(TODAY,4)),rangeTo:ymd(addDays(TODAY,4)),estimated:true}}));
  const showtimes=[];const fm=['數位 英語','IMAX 英語','4DX 3D 英語'];
  cinemas.forEach((c,ci)=>movies.filter(m=>m.status==='now').forEach((m,mi)=>{for(let i=0;i<4;i++)['10:30','13:50','16:20','19:40','22:10'].forEach((t,k)=>{if((ci+mi+k+i)%3)showtimes.push({cinema:c.id,movie:m.id,date:ymd(addDays(TODAY,i)),time:t,format:fm[(mi+k)%3]})})}));
  return{demo:true,updatedAt:new Date().toISOString(),movies,cinemas,showtimes};
}

/* ---- 標準化 ---- */
let DB=null, IDX={}, BYM={}, LOAD_ERR='';
function setData(raw){
  const movies=raw.movies||[], shows=raw.showtimes||[];
  // 分級統一成「普／護／輔12／輔15／限」（部分來源寫成「輔12級」）
  movies.forEach(m=>{if(m.rating)m.rating=String(m.rating).replace(/級$/,'').replace('普遍','普').replace('保護','護').replace('輔導','輔').replace('限制','限')});
  const cinemas=(raw.cinemas||[]).map(c=>({...c,_city:cityOf(c)}));
  const ci=c=>{const i=CITY_ORDER.indexOf(c._city);return i<0?99:i};
  cinemas.sort((a,b)=>ci(a)-ci(b)||String(a.chain).localeCompare(String(b.chain),'zh-Hant')||a.name.localeCompare(b.name,'zh-Hant'));
  shows.forEach((s,i)=>{s._i=i;s._k=kindsOf(s.format);s._l=langsOf(s.format)});
  IDX={};BYM={};
  for(const s of shows){const k=s.cinema+'|'+s.movie+'|'+s.date;(IDX[k]=IDX[k]||[]).push(s);(BYM[s.movie]=BYM[s.movie]||[]).push(s)}
  for(const k in IDX)IDX[k].sort((a,b)=>tkey(a.time).localeCompare(tkey(b.time)));
  const cities=[...new Set(cinemas.map(c=>c._city))];
  DB={demo:!!raw.demo,updatedAt:raw.updatedAt,status:raw.status||[],chains:[...new Set(cinemas.map(c=>c.chain).filter(Boolean))],cities,movies,cinemas,shows,
    byM:Object.fromEntries(movies.map(m=>[m.id,m])),byC:Object.fromEntries(cinemas.map(c=>[c.id,c]))};
  const maxD=shows.reduce((a,s)=>s.date>a?s.date:a,todayS);
  DB.lastDate=maxD;
  if(S.city!=='全台'&&!cities.includes(S.city))S.city='全台';
}
const showsOf=(c,m,d)=>IDX[c+'|'+m+'|'+d]||[];
const published=(c,d)=>!c.publish?.publishedUntil||d<=c.publish.publishedUntil;

/* ---- 海報：網站自帶 → 官網 → 產生替代圖 ---- */
function posterErr(img){const r=img.dataset.remote;if(r&&img.getAttribute('src')!==r){img.dataset.remote='';img.src=r;return}img.onerror=null;img.src=img.dataset.fb}
function fallbackPoster(m){
  const h=m.hue??(Math.abs([...m.title].reduce((a,c)=>a+c.charCodeAt(0),0))%360);
  const t=[...m.title].slice(0,10).join('');
  const lines=t.length>5?[t.slice(0,Math.ceil(t.length/2)),t.slice(Math.ceil(t.length/2))]:[t];
  const txt=lines.map((l,i)=>`<text x="20" y="${250+i*40}" font-size="32" font-weight="800" fill="#16181d" font-family="sans-serif">${esc(l)}</text>`).join('');
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 360"><rect width="240" height="360" fill="hsl(${h},35%,90%)"/><rect x="20" y="20" width="200" height="190" rx="6" fill="hsl(${h},45%,78%)"/>${txt}<text x="20" y="${lines.length>1?336:300}" font-size="11" fill="#5b6270" font-family="sans-serif">${esc((m.en||'').slice(0,30))}</text></svg>`;
  return 'data:image/svg+xml;utf8,'+encodeURIComponent(svg);
}
function posterImg(m,eager){
  const fb=fallbackPoster(m), src=m.posterLocal||fb, remote='';  // 不再改用官網原圖（外部連線），本地縮圖失敗就用產生的替代圖
  return `<img referrerpolicy="no-referrer" alt="" ${eager?'':'loading="lazy"'} src="${esc(src)}" onerror="posterErr(this)" data-remote="${esc(remote)}" data-fb="${fb.replace(/"/g,'&quot;')}">`;
}
const rateTag=m=>m.rating?`<span class="rt rt-${esc(m.rating)}" title="${esc(m.rating)}級">${esc(m.rating.replace('輔',''))}</span>`:'';

/* ================= 狀態 ================= */
const S={route:'now',id:null,date:todayS,city:store.get('city','全台'),from:'',to:'',kinds:new Set(),langs:new Set(),chains:new Set(),favs:new Set(store.get('favs',[])),showPast:false,q:'',cq:'',open:new Set(),closed:new Set(),openFor:null};
const $=s=>document.querySelector(s);
const bar=$('#bar'), sub=$('#sub'), view=$('#view'), layer=$('#layer');
// 時段：使用者自填「從 S.from 到 S.to」，留空代表不限；午夜場（0–3 點）算在當天最後
function inPeriod(t){const k=tkey(t);if(S.from&&k<tkey(S.from))return false;if(S.to&&k>tkey(S.to))return false;return true}
const periodOn=()=>!!(S.from||S.to);
const periodLabel=()=>S.from&&S.to?S.from+'–'+S.to:S.from?S.from+' 後':S.to+' 前';
const isPast=s=>s.date===todayS&&s.time<nowHM()&&+s.time.slice(0,2)>=4;
const showOK=s=>inPeriod(s.time)&&(!S.kinds.size||s._k.some(k=>S.kinds.has(k)))&&(!S.langs.size||s._l.some(l=>S.langs.has(l)));
const areaCinemas=()=>DB.cinemas.filter(c=>(S.city==='全台'||c._city===S.city)&&(!S.chains.size||S.chains.has(c.chain)));
const isFav=id=>S.favs.has(id);
function toggleFav(id){S.favs.has(id)?S.favs.delete(id):S.favs.add(id);store.set('favs',[...S.favs]);WatchCore.idbSet('favs',[...S.favs]).catch(()=>{});if((S.watches||[]).some(w=>w.area==='fav'))pushSync();toast(S.favs.has(id)?'已加入常用影城，會排在最前面':'已移出常用影城')}
const filterCount=()=>(periodOn()?1:0)+S.kinds.size+S.langs.size+S.chains.size;
// 快捷列：只放特殊廳規格與語言，顯示這天有場次的選項
const kindChips=list=>KINDS.filter(k=>list.some(s=>s._k.includes(k))).map(k=>`<button class="chip" data-kind="${esc(k)}" aria-pressed="${S.kinds.has(k)}">${esc(k)}</button>`).join('');
const langChips=list=>LANGS.filter(l=>list.some(s=>s._l.includes(l))).map(l=>`<button class="chip" data-lang="${esc(l)}" aria-pressed="${S.langs.has(l)}">${esc(l)}</button>`).join('');

/* ================= 共用區塊 ================= */
function dateStrip(dates,countFn){
  return `<div class="dates" role="group" aria-label="選擇日期">${dates.map(s=>{const d=parseYmd(s);const n=countFn?countFn(s):1;
    return `<button class="d ${n?'':'none'}" data-date="${s}" aria-pressed="${s===S.date}" aria-label="${d.getMonth()+1}月${d.getDate()}日 星期${WD[d.getDay()]}${n?'':'，沒有場次'}">${dayName(s)}<b>${d.getDate()}</b></button>`}).join('')}</div>`;
}
function nextDates(n=10){const out=[];for(let i=0;i<n;i++){const s=ymd(addDays(TODAY,i));if(i>6&&s>DB.lastDate)break;out.push(s)}return out}
function filterBar(){
  const n=filterCount();
  const pills=[];
  if(periodOn())pills.push(`<button class="chip x" data-unset="period">${periodLabel()} ${ICON.x}</button>`);
  S.kinds.forEach(k=>pills.push(`<button class="chip x" data-unset="kind" data-v="${esc(k)}">${esc(k)} ${ICON.x}</button>`));
  S.langs.forEach(k=>pills.push(`<button class="chip x" data-unset="lang" data-v="${esc(k)}">${esc(k)} ${ICON.x}</button>`));
  S.chains.forEach(k=>pills.push(`<button class="chip x" data-unset="chain" data-v="${esc(k)}">${esc(k)} ${ICON.x}</button>`));
  const day=DB.shows.filter(s=>s.date===S.date);
  const quick=n?'':kindChips(day);
  return `<div class="fbar"><button class="chip" data-act="filters" aria-pressed="${n>0}">${ICON.filter}篩選${n?`<span class="n">${n}</span>`:''}</button>${pills.join('')}${quick}</div>`;
}
function stubsHTML(list){
  return `<div class="stubs">${list.map(s=>{const st=s.seats==='out'?'已售完':s.seats==='low'?'座位不多':'';
    return `<button class="stub ${s.seats||''}" data-show="${s._i}" aria-label="${s.time}${s.hall?' '+esc(s.hall):''}${st?' '+st:''}"><b>${s.time}</b>${st||s.hall?`<span>${esc(st||s.hall)}</span>`:''}</button>`}).join('')}</div>`;
}
function groupedTimes(list){
  const by=new Map();for(const s of list){const k=s.format||'';if(!by.has(k))by.set(k,[]);by.get(k).push(s)}
  return [...by].map(([f,l])=>`<div class="fg">${f?`<div class="fg-l">${esc(f)}</div>`:''}${stubsHTML(l)}</div>`).join('');
}
// 影城列表只留一短句：「下次公布 11/25（三）」，官方公告才加「官方」標籤
function pubLine(c){
  const p=c.publish;if(!p||!p.nextAt)return '';
  return `<div class="publine">下次公布 ${md(p.nextAt.slice(0,10))}${p.official?'<span class="tag ok">官方</span>':''}</div>`;
}
function pubBox(c){
  const p=c.publish;if(!p)return '';
  const rows=[`<div>已公布到 <b>${p.publishedUntil?md(p.publishedUntil):'—'}</b>${p.presale?'，另有預售場次':''}</div>`];
  if(p.nextAt){const [d,t]=p.nextAt.split('T');rows.push(`<div>下次公布 <b>${md(d)}${t?' '+esc(t):''}</b>${p.official?'<span class="tag ok">官方公告</span>':'<span class="tag est">推估</span>'}</div>`)}
  if(p.rangeFrom&&p.rangeTo)rows.push(`<div>屆時公布 <b>${p.rangeFrom===p.rangeTo?md(p.rangeFrom):md(p.rangeFrom)+' 到 '+md(p.rangeTo)}</b></div>`);
  return `<div class="notice pubbox">${rows.join('')}</div>`;
}
function earliestPublish(cs){
  let best=null;for(const c of cs){const n=c.publish?.nextAt;if(n&&(!best||n<best.n))best={n,c}}return best;
}
const metaLine=m=>[m.genre,m.runtime?m.runtime+' 分鐘':''].filter(Boolean).map(esc).join('，');

/* ================= 頁面 ================= */
function fmtAgo(iso){
  const t=new Date(iso);if(isNaN(t))return null;
  const m=Math.round((Date.now()-t)/60000);
  if(m<2)return{t:'剛剛更新'};
  if(m<60)return{t:m+' 分鐘前更新'};
  if(m<24*60)return{t:Math.floor(m/60)+' 小時前更新'};
  return{t:fmtTime(iso)+' 更新（資料偏舊）',stale:true};
}
function topBar(){
  if(S.route==='movie'||S.route==='cinema')return `<button class="back" data-act="back" aria-label="返回">${ICON.back}返回</button><span style="margin-right:auto"></span><button class="loc" data-act="loc">${ICON.pin}${esc(S.city)}${ICON.down}</button>`;
  const ago=DB&&!DB.demo&&DB.updatedAt?fmtAgo(DB.updatedAt):null;
  return `<div class="brand"><img src="icon-192.png" alt="" width="30" height="30"><div><span class="bn">Reeltime</span><small class="${ago&&ago.stale?'stale':''}">${esc(ago?ago.t:'全台電影場次')}</small></div></div><button class="loc" data-act="loc" aria-label="地區：${esc(S.city)}，點擊切換">${ICON.pin}${esc(S.city)}${ICON.down}</button><button class="ibtn" data-act="search" aria-label="搜尋電影或影城">${ICON.search}</button>`;
}
function demoBanner(){
  if(!DB.demo)return '';
  return `<div class="banner demo"><div class="main">讀不到場次資料${LOAD_ERR?'（'+esc(LOAD_ERR)+'）':''}，目前顯示的是示範內容。</div><button class="btn" data-act="reload">重新整理</button></div>`;
}
function bad(){const b=DB.status.filter(x=>!x.ok).map(x=>x.chain);return b.length?`<div class="note" style="margin:0 0 10px">${esc(b.join('、'))} 這次更新失敗，暫時顯示前一次的場次。</div>`:''}

/* 現正上映 */
function movieCountIn(cs,m,d){let n=0,next='';const ids=new Set();for(const c of cs)for(const s of showsOf(c.id,m.id,d))if(showOK(s)&&!isPast(s)){n++;ids.add(c.id);if(!next||tkey(s.time)<tkey(next))next=s.time}return{n,next,c:ids.size}}
function pageNow(){
  const cs=areaCinemas();
  const dayCount=d=>DB.movies.some(m=>m.status!=='soon'||m.presale?cs.some(c=>showsOf(c.id,m.id,d).length):false)?1:0;
  sub.innerHTML=dateStrip(nextDates(),dayCount)+filterBar();
  const list=[];
  for(const m of DB.movies){if(m.status==='soon'&&!m.presale)continue;const r=movieCountIn(cs,m,S.date);if(r.n)list.push([m,r])}
  list.sort((a,b)=>b[1].n-a[1].n);
  let html=demoBanner()+bad();
  // 定位提示：單行橫幅，可關閉（記住不再顯示）；隱私說明在縣市面板裡
  if(S.city==='全台'&&!store.get('askedCity',false)&&!store.get('geoBarOff',false))html+=`<div class="geo-bar"><span>只看附近影城？</span><button class="btn pri" data-act="geo">使用目前位置</button><button class="btn" data-act="loc">選縣市</button><button class="x" data-act="geobaroff" aria-label="關閉，不再顯示">${ICON.x}</button></div>`;
  if(!list.length){
    const unpub=cs.length&&cs.every(c=>!published(c,S.date));
    const e=earliestPublish(cs);
    html+=unpub?`<div class="empty"><b>${md(S.date)}的場次還沒公布</b>${e?`最快的是 ${esc(e.c.name)}，預計 ${md(e.n.slice(0,10))}${e.n.includes('T')?' '+e.n.slice(11):''} 公布。`:''}<br><a class="btn" href="#/cinemas">看各影城公布時間</a></div>`
      :`<div class="empty"><b>這個條件下沒有場次</b>${S.date===todayS?'今天的場次可能都已開演。':''}試試其他日期，或放寬篩選條件。<br>${filterCount()?'<button class="btn" data-act="clear">清除篩選</button> ':''}${S.city!=='全台'?`<button class="btn" data-setcity="全台">改看全台</button>`:''}<a class="btn" href="#/soon">看即將上映</a></div>`;
  }else{
    html+=`<div class="sec-h"><h2>${dayName(S.date)} ${md(S.date).replace(/（.）/,'')} 有 ${list.length} 部電影</h2><span>${esc(S.city)}${S.chains.size?'・'+esc([...S.chains].join('、')):''}</span></div>`;
    html+=`<div class="grid">${list.map(([m,r])=>`<a class="mv" href="#/movie/${encodeURIComponent(m.id)}"><div class="poster">${posterImg(m)}${rateTag(m)}${m.status==='soon'?'<span class="flag">預售</span>':''}</div><h3>${esc(m.title)}</h3><p>下一場<b>${r.next}</b>・${r.c}間</p></a>`).join('')}</div>`;
  }
  html+=foot();
  view.innerHTML=html;
}

/* 即將上映 */
function pageSoon(){
  sub.innerHTML='';
  const l=DB.movies.filter(m=>m.status==='soon').sort((a,b)=>String(a.release).localeCompare(String(b.release))||a.title.localeCompare(b.title,'zh-Hant'));
  let html=demoBanner();
  if(!l.length){view.innerHTML=html+'<div class="empty"><b>目前沒有即將上映的電影</b></div>'+foot();return}
  const by=new Map();for(const m of l){const k=m.release||'未定';if(!by.has(k))by.set(k,[]);by.get(k).push(m)}
  for(const [d,ms] of by){
    html+=`<div class="sec-h"><h2>${d==='未定'?'上映日未定':md(d)+' 上映'}</h2><span>${ms.length} 部</span></div><div class="grid">${ms.map(m=>`<a class="mv" href="#/movie/${encodeURIComponent(m.id)}"><div class="poster">${posterImg(m)}${rateTag(m)}${m.presale?'<span class="flag">預售</span>':''}</div><h3>${esc(m.title)}</h3><p>${metaLine(m)||'&nbsp;'}</p></a>`).join('')}</div>`;
  }
  view.innerHTML=html+foot();
}

/* 影城列表 */
function cinemaRow(c){
  const n=DB.movies.reduce((a,m)=>a+showsOf(c.id,m.id,todayS).filter(s=>!isPast(s)).length,0);
  return `<div class="row"><a class="main" href="#/cinema/${encodeURIComponent(c.id)}" style="text-decoration:none"><h3>${esc(c.name)}</h3><div class="sub">${esc(c.chain||'')}・${esc(c._city)}</div>${pubLine(c)}</a><a class="side${n?'':' none'}" href="#/cinema/${encodeURIComponent(c.id)}" style="text-decoration:none" aria-hidden="true" tabindex="-1">${n?`<b>${n}</b>今天還有`:'今天無場次'}</a><button class="star" data-fav="${esc(c.id)}" aria-pressed="${isFav(c.id)}" aria-label="${isFav(c.id)?'移出':'加入'}常用影城">${isFav(c.id)?ICON.star:ICON.starO}</button></div>`;
}
function pageCinemas(){
  sub.innerHTML=`<div style="padding:8px 0 10px"><label class="search">${ICON.search}<span class="sr">搜尋影城</span><input id="cq" type="search" placeholder="搜尋影城名稱或品牌" value="${esc(S.cq)}" autocomplete="off"></label></div>`;
  renderCinemaList();
}
function renderCinemaList(){
  const q=S.cq.trim().toLowerCase();
  const match=c=>!q||(c.name+c.chain+c._city).toLowerCase().includes(q);
  const favs=DB.cinemas.filter(c=>isFav(c.id)&&match(c));
  const rest=DB.cinemas.filter(c=>!isFav(c.id)&&match(c)&&(q||S.city==='全台'||c._city===S.city));
  let html=demoBanner();
  if(favs.length)html+=`<div class="sec-h"><h2>常用影城</h2><span>${favs.length} 間</span></div><div class="list">${favs.map(cinemaRow).join('')}</div>`;
  else if(!q)html+=`<div class="note" style="margin:0 0 12px">點影城右邊的星號加入常用，會固定排在最前面。</div>`;
  const by=new Map();for(const c of rest){if(!by.has(c._city))by.set(c._city,[]);by.get(c._city).push(c)}
  for(const [city,cs] of by)html+=`<div class="sec-h"><h2>${esc(city)}</h2><span>${cs.length} 間</span></div><div class="list">${cs.map(cinemaRow).join('')}</div>`;
  if(!favs.length&&!rest.length)html+=`<div class="empty"><b>找不到「${esc(S.cq)}」</b>試試品牌名稱，例如「威秀」。</div>`;
  if(!q&&S.city!=='全台')html+=`<div style="text-align:center;margin-top:16px"><button class="btn" data-setcity="全台">看全台影城</button></div>`;
  view.innerHTML=html+foot();
}

/* 電影頁 */
function watchBtn(m){
  const w=S.watches.find(x=>x.movie===m.id),soon=m.status==='soon'&&!m.presale;
  return `<button class="btn watch${w?' on':''}" data-watch="${esc(m.id)}">${ICON.bell}${w?'追蹤中':soon?'開賣時通知我':'追蹤新場次'}</button>`;
}
function pageMovie(id){
  const m=DB.byM[id];
  if(!m){view.innerHTML='<div class="empty"><b>找不到這部電影</b>可能已經下檔。<br><a class="btn" href="#/">回到現正上映</a></div>';sub.innerHTML='';return}
  document.title=m.title+'｜Reeltime';
  const cs=areaCinemas();
  const all=BYM[m.id]||[];
  const areaIds=new Set(cs.map(c=>c.id));
  const dset=new Set(all.filter(s=>areaIds.has(s.cinema)).map(s=>s.date));
  let dates=nextDates();
  const extra=[...dset].filter(d=>!dates.includes(d)&&d>=todayS).sort();
  dates=[...dates,...extra].slice(0,21);
  if(m.status==='soon'&&dset.size&&!dset.has(S.date))S.date=[...dset].sort()[0];
  sub.innerHTML='';
  const facts=[m.rating?m.rating+'級':'',m.runtime?m.runtime+' 分鐘':'',m.genre,m.release?(m.release>todayS?md(m.release)+' 上映':md(m.release)+' 上映'):''].filter(Boolean);
  let html=`<div class="hero"><div class="poster">${posterImg(m,true)}</div><div><h1>${esc(m.title)}</h1>${m.en?`<div class="en">${esc(m.en)}</div>`:''}<div class="facts">${facts.map(f=>`<span class="fact">${esc(f)}</span>`).join('')}</div>${watchBtn(m)}</div></div>`;
  if(m.synopsis)html+=`<p class="syn" id="syn">${esc(m.synopsis)}</p>${m.synopsis.length>70?'<button class="more" data-act="syn">展開簡介</button>':''}`;
  if(m.status==='soon'&&!m.presale){
    const e=earliestPublish(cs);
    html+=`<div class="sec-h"><h2>場次</h2></div><div class="notice warn">還沒開賣。場次公布後，會出現在「現正上映」${e?`；${esc(S.city)}最快的是 <b>${esc(e.c.name)}</b>，預計 <b>${md(e.n.slice(0,10))}${e.n.includes('T')?' '+e.n.slice(11):''}</b> 公布下一批場次`:''}。</div>`;
    view.innerHTML=html+foot();return;
  }
  const count=d=>cs.reduce((a,c)=>a+showsOf(c.id,m.id,d).length,0);
  html+=`<div class="sec-h" style="margin:12px 0 0"><h2>場次</h2><span>${esc(S.city)}</span></div>`;
  // 日期列與版本／語言快捷鈕放在頂部固定區（跟首頁一樣），捲動時不用回到最上面換日期
  const dayShows=cs.flatMap(c=>showsOf(c.id,m.id,S.date));
  sub.innerHTML=dateStrip(dates,count)+`<div class="fbar">${kindChips(dayShows)}${langChips(dayShows)}${S.chains.size?[...S.chains].map(k=>`<button class="chip x" data-unset="chain" data-v="${esc(k)}">${esc(k)} ${ICON.x}</button>`).join(''):''}</div>`;
  // 影城：常用的排前面，其餘依縣市
  let pastN=0;
  const blocks=[];
  for(const c of cs){
    const l=showsOf(c.id,m.id,S.date).filter(showOK);
    const future=l.filter(s=>!isPast(s));pastN+=l.length-future.length;
    const show=S.showPast?l:future;
    if(show.length)blocks.push({c,show});
  }
  blocks.sort((a,b)=>(isFav(b.c.id)-isFav(a.c.id))||((cDist(a.c)??1e9)-(cDist(b.c)??1e9)));
  if(!blocks.length){
    const unpub=cs.length&&cs.every(c=>!published(c,S.date));
    const e=earliestPublish(cs);
    html+=unpub?`<div class="notice warn">${md(S.date)}的場次還沒公布${e?`。最快是 <b>${esc(e.c.name)}</b>，預計 <b>${md(e.n.slice(0,10))}${e.n.includes('T')?' '+e.n.slice(11):''}</b> 公布`:''}。</div>`
      :`<div class="empty"><b>${md(S.date)}${esc(S.city==='全台'?'':S.city)}沒有符合的場次</b>${pastN&&!S.showPast?`今天已開演 ${pastN} 場。`:'換個日期、縣市，或放寬篩選試試。'}${S.city!=='全台'?`<br><button class="btn" data-setcity="全台">改看全台</button>`:''}</div>`;
    html+=`<div style="text-align:center;margin:-4px 0 12px"><button class="btn" data-watchnew="${esc(m.id)}">${ICON.bell}有場次時通知我</button></div>`;
  }else{
    // 預設收合：只有一間影城、或是常用影城時自動展開；其他由使用者點開
    if(S.openFor!==m.id){S.openFor=m.id;S.open=new Set()}
    const isOpen=c=>S.open.has(c.id)||(!S.closed.has(c.id)&&(blocks.length===1||isFav(c.id)));
    const allOpen=blocks.every(b=>isOpen(b.c));
    html+=`<div class="cin-tools"><span>${blocks.length} 間影城有場次，點影城看時間</span>${blocks.length>1?`<button class="lnk" data-act="${allOpen?'collapseall':'expandall'}">${allOpen?'全部收起':'全部展開'}</button>`:''}</div>`;
    let lastGroup='';
    for(const {c,show} of blocks){
      const g=isFav(c.id)?'常用影城':(S.city==='全台'?c._city:'');
      if(g&&g!==lastGroup){html+=`<div class="sec-h"><h2>${esc(g)}</h2></div>`;lastGroup=g}
      const op=isOpen(c);
      const next=show.slice(0,4).map(x=>x.time).join('　');
      const fmts=[...new Set(show.map(x=>x.format).filter(Boolean))];
      html+=`<div class="cin fold${op?' open':''}"><div class="cin-h"><button class="main tog" data-toggle="${esc(c.id)}" aria-expanded="${op}"><h3>${esc(c.name)}</h3><div class="sub">${esc(c.chain||'')}・${esc(c._city)}${cDist(c)!=null?`・<span class="dist">${kmTxt(cDist(c))}</span>`:''}</div>${op?'':`<div class="peek"><b>${show.length} 場</b><span>${esc(next)}${show.length>4?'…':''}</span></div>${fmts.length?`<div class="peek-f">${fmts.slice(0,3).map(esc).join('・')}${fmts.length>3?'…':''}</div>`:''}`}</button><button class="star" data-fav="${esc(c.id)}" aria-pressed="${isFav(c.id)}" aria-label="${isFav(c.id)?'移出':'加入'}常用影城">${isFav(c.id)?ICON.star:ICON.starO}</button><span class="chev" aria-hidden="true">${ICON.down}</span></div>${op?groupedTimes(show)+`<a class="lnk cin-more" href="#/cinema/${encodeURIComponent(c.id)}">看這間影城的所有電影 ›</a>`:''}</div>`;
    }
  }
  if(pastN)html+=`<button class="past" data-act="past">${S.showPast?'隱藏已開演的場次':`顯示已開演的 ${pastN} 場`}</button>`;
  view.innerHTML=html+foot();
}

/* 影城頁 */
function pageCinema(id){
  const c=DB.byC[id];
  if(!c){view.innerHTML='<div class="empty"><b>找不到這間影城</b><br><a class="btn" href="#/cinemas">回到影城列表</a></div>';sub.innerHTML='';return}
  document.title=c.name+'｜Reeltime';
  sub.innerHTML='';
  const ms=DB.movies.filter(m=>m.status!=='soon'||m.presale);
  const count=d=>ms.reduce((a,m)=>a+showsOf(c.id,m.id,d).length,0);
  const dates=nextDates(14);
  const map='https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(c.addr&&c.addr.length>6?c.addr:c.name);
  let html=`<div class="cin-h"><div class="main"><h1 style="margin:0;font-size:21px;line-height:1.3">${esc(c.name)}</h1><div class="sub">${esc(c.chain||'')}・${esc(c.addr||c._city)}</div></div><button class="star" data-fav="${esc(c.id)}" aria-pressed="${isFav(c.id)}" aria-label="${isFav(c.id)?'移出':'加入'}常用影城">${isFav(c.id)?ICON.star:ICON.starO}</button></div>
  <div class="links"><a class="btn" href="${esc(map)}" target="_blank" rel="noopener noreferrer">地圖</a><a class="btn" href="${esc(c.site||'#')}" target="_blank" rel="noopener noreferrer">${c.chain==='其他影城'?(/atmovies/.test(c.site||'')?'開眼時刻表':'影城官網'):esc(c.chain||'')+'官網'}</a></div>
  <div style="margin-top:12px">${pubBox(c)}</div>`;
  html+=`<div class="sec-h" style="margin-bottom:0"><h2>場次</h2></div>`+dateStrip(dates,count);
  const cDay=ms.flatMap(m=>showsOf(c.id,m.id,S.date));
  html+=`<div class="fbar">${kindChips(cDay)}${langChips(cDay)}</div>`;
  let pastN=0;const rows=[];
  for(const m of ms){const l=showsOf(c.id,m.id,S.date).filter(showOK);const f=l.filter(s=>!isPast(s));pastN+=l.length-f.length;const show=S.showPast?l:f;if(show.length)rows.push({m,show})}
  rows.sort((a,b)=>tkey(a.show[0].time).localeCompare(tkey(b.show[0].time)));
  if(!rows.length){
    html+=!published(c,S.date)?`<div class="notice warn">${md(S.date)}的場次還沒公布。</div>`:`<div class="empty"><b>${md(S.date)}沒有符合的場次</b>${pastN&&!S.showPast?`今天已開演 ${pastN} 場。`:'換個日期或放寬篩選試試。'}</div>`;
  }else{
    html+=`<div class="cin">${rows.map(({m,show})=>`<div class="cin-l"><a class="poster" href="#/movie/${encodeURIComponent(m.id)}" aria-label="${esc(m.title)}">${posterImg(m)}</a><div class="main"><h3><a href="#/movie/${encodeURIComponent(m.id)}" style="text-decoration:none">${esc(m.title)}</a> ${m.rating?`<span class="fact" style="font-size:11px;padding:0 5px">${esc(m.rating)}</span>`:''}</h3>${groupedTimes(show)}</div></div>`).join('')}</div>`;
  }
  if(pastN)html+=`<button class="past" data-act="past">${S.showPast?'隱藏已開演的場次':`顯示已開演的 ${pastN} 場`}</button>`;
  view.innerHTML=html+foot();
}

/* ================= 面板 ================= */
let sheetOpen=false, ignorePop=0;
function openSheet(html,label,full,cls){
  if(!sheetOpen){history.pushState({sheet:1},'');sheetOpen=true}
  layer.innerHTML=`<div class="ov${full?' top':''}" id="ov"><div class="sheet${full?' full':''}${cls?' '+cls:''}" role="dialog" aria-modal="true" aria-label="${esc(label||'')}">${full?'':'<div class="grab"></div>'}${html}</div></div>`;
  $('#ov').addEventListener('click',e=>{if(e.target.id==='ov')closeSheet()});
  document.body.style.overflow='hidden';
  // 只對明確標 autofocus 的欄位（搜尋框）自動聚焦；其他面板聚焦在面板本身，
  // 否則每次點選項重畫面板時，焦點會落到「時段」的時間欄位，iPhone 就會跳出時間轉盤
  const f=layer.querySelector('[autofocus]');
  if(f)f.focus({preventScroll:true});else{const sh=layer.querySelector('.sheet');sh.setAttribute('tabindex','-1');sh.focus({preventScroll:true})}
}
function closeSheet(fromPop){
  if(!sheetOpen)return;
  layer.innerHTML='';document.body.style.overflow='';sheetOpen=false;
  if(!fromPop){ignorePop++;history.back()}
}

/* ---- 定位：在手機上判斷所在縣市，位置不會離開手機 ----
 * 1. 只有使用者按「使用目前位置」才向系統要位置（先說明、再詢問）
 * 2. 座標只在這支手機裡和 tw-counties.json（內建的縣市邊界）比對，算出縣市後就丟掉；不上傳、不儲存
 * 3. 頁首的 Content-Security-Policy 讓瀏覽器擋下所有對外連線，就算程式寫錯也送不出去
 * cityMode：'auto'＝每次開啟依位置切換（僅限使用者同意過）；'manual'＝使用者自己選的縣市 */
const CITY_CENTER={'台北市':[25.04,121.56],'新北市':[25.01,121.46],'基隆市':[25.13,121.74],'桃園市':[24.99,121.30],'新竹市':[24.80,120.97],'新竹縣':[24.83,121.01],'宜蘭縣':[24.75,121.75],'苗栗縣':[24.56,120.82],'台中市':[24.15,120.67],'彰化縣':[24.08,120.54],'南投縣':[23.91,120.68],'雲林縣':[23.71,120.43],'嘉義市':[23.48,120.45],'嘉義縣':[23.46,120.25],'台南市':[22.99,120.21],'高雄市':[22.63,120.30],'屏東縣':[22.67,120.49],'花蓮縣':[23.98,121.60],'台東縣':[22.76,121.14],'澎湖縣':[23.57,119.58],'金門縣':[24.43,118.32],'連江縣':[26.16,119.95]};
const cityMode=()=>store.get('cityMode',store.get('askedCity',false)?'manual':'auto');
function nearestCity(lat,lng){
  const has=new Set(DB.cinemas.map(c=>c._city));let best=null,bd=1e9;
  for(const [c,[a,b]] of Object.entries(CITY_CENTER)){if(!has.has(c))continue;const d=(a-lat)**2+((b-lng)*Math.cos(lat*Math.PI/180))**2;if(d<bd){bd=d;best=c}}
  return best;
}
let COUNTIES=null, CGEO=null;
async function loadCinemaGeo(){if(!CGEO){try{CGEO=(await fetch('cinema-geo.json').then(r=>r.json())).cinemas||{}}catch(e){CGEO={}}}return CGEO}
const cGeo=c=>CGEO&&CGEO[c.id];
/* ---- 精確路程時間查表（docs/travel/{cinemaId}.bin） ----
 * 這份查表是伺服器事先用真實路網（OSRM）與真實班表（TDX）算好的，App 只用使用者
 * 在手機上的目前位置換算成「格子編號」去查表，位置本身不會離開手機（跟縣市定位
 * 用的是同一組隱私承諾）。網格公式必須跟 tools/travel/grid.py 逐字一致，見
 * test/travel_grid.mjs。只有少數影城（目前是 3 間試算影城）有這份資料，其他
 * 影城查不到時會退回 travelMin() 的直線距離粗估。 */
const TLAT0=21.8, TLON0=119.3, TCELL_M=500, TREF_LAT=23.7;
const TD_LAT=TCELL_M/111320.0, TD_LON=TCELL_M/(111320.0*Math.cos(TREF_LAT*Math.PI/180));
function travelCellOf(lat,lon){return [Math.floor((lat-TLAT0)/TD_LAT), Math.floor((lon-TLON0)/TD_LON)]}
const TRAVELBIN={}; // cinemaId -> {header,bytes} | null（null＝查過但沒有這份資料，不用重試）
async function loadTravelBin(cinemaId){
  if(cinemaId in TRAVELBIN)return TRAVELBIN[cinemaId];
  try{
    const buf=await fetch('travel/'+encodeURIComponent(cinemaId)+'.bin').then(r=>{if(!r.ok)throw 0;return r.arrayBuffer()});
    const dv=new DataView(buf);
    const n=dv.getUint32(0,true);
    const header=JSON.parse(new TextDecoder().decode(new Uint8Array(buf,4,n)));
    const bytes=new Uint8Array(buf,4+n);
    TRAVELBIN[cinemaId]={header,bytes};
  }catch(e){TRAVELBIN[cinemaId]=null}
  return TRAVELBIN[cinemaId];
}
/* 回傳查到的分鐘數（已套過校正倍率），查不到（範圍外、255、沒有這份資料）回 null，
 * 由呼叫端退回粗估。mode 對應 MODES 的 key：transit/scooter/car/walk。 */
function travelLookup(cinemaId,lat,lon,mode){
  const d=TRAVELBIN[cinemaId];if(!d)return null;
  const h=d.header;
  const [row,col]=travelCellOf(lat,lon);
  const r=row-h.row0, c=col-h.col0;
  if(r<0||c<0||r>=h.height||c>=h.width)return null;
  const li=h.layers.indexOf(mode);if(li<0)return null;
  const v=d.bytes[li*h.width*h.height + r*h.width + c];
  return v===255?null:v;
}
// 使用者位置只放在記憶體（S.here），關掉 App 就消失；不寫進手機儲存、不上傳
function distKm(a,b){const R=6371,t=x=>x*Math.PI/180;const dLa=t(b[0]-a[0]),dLo=t(b[1]-a[1]);const h=Math.sin(dLa/2)**2+Math.cos(t(a[0]))*Math.cos(t(b[0]))*Math.sin(dLo/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
const cDist=c=>S.here&&cGeo(c)?distKm([S.here.lat,S.here.lng],cGeo(c)):null;
const kmTxt=d=>d==null?'':d<1?Math.round(d*1000/50)*50+' 公尺':d<10?d.toFixed(1)+' 公里':Math.round(d)+' 公里';
/* 交通時間推估（直線距離換算，僅供參考；精確時間請用地圖 App）
 * 繞路係數：一般道路約為直線的 1.3–1.4 倍 */
// gd：Google 地圖網址 data 參數的交通方式代碼（3e0 開車、3e2 走路、3e3 大眾運輸）
const MODES={transit:{label:'大眾運輸',g:'transit',gd:3,a:'r'},scooter:{label:'機車',g:'two-wheeler',gd:0,a:'d'},car:{label:'開車',g:'driving',gd:0,a:'d'},walk:{label:'走路',g:'walking',gd:2,a:'w'}};
function travelMin(km,mode){
  const road=km*(mode==='walk'?1.25:1.35);
  let m;
  if(mode==='walk')m=road/4.8*60;
  else if(mode==='scooter')m=road/(road>15?35:22)*60+5;          // 含停車
  else if(mode==='car')m=road/(road>15?45:22)*60+10;             // 含找停車位
  else m=(road<1.2?road/4.8*60:road/(road>25?40:18)*60+12);      // 含走到站、等車
  return Math.max(3,Math.round(m));
}
function getHere(prompt){
  return new Promise(res=>{
    if(S.here&&Date.now()-S.here.t<10*60*1000)return res(S.here);
    if(!('geolocation' in navigator))return res(null);
    if(!prompt&&!store.get('geoOK',false))return res(null);
    navigator.geolocation.getCurrentPosition(p=>{S.here={lat:p.coords.latitude,lng:p.coords.longitude,t:Date.now()};store.set('geoOK',true);store.set('geoDenied',false);res(S.here)},
      e=>{if(e.code===1){store.set('geoDenied',true);store.set('geoOK',false)}res(null)},{enableHighAccuracy:false,timeout:10000,maximumAge:5*60*1000});
  });
}
async function loadCounties(){if(!COUNTIES){try{COUNTIES=(await fetch('tw-counties.json').then(r=>r.json())).counties}catch(e){COUNTIES=[]}}return COUNTIES}
function inRing(x,y,r){let c=false;for(let i=0,j=r.length-1;i<r.length;j=i++){const xi=r[i][0],yi=r[i][1],xj=r[j][0],yj=r[j][1];if((yi>y)!==(yj>y)&&x<(xj-xi)*(y-yi)/(yj-yi)+xi)c=!c}return c}
function countyAt(lat,lng){for(const c of COUNTIES||[])for(const p of c.polys)if(inRing(lng,lat,p[0])&&!p.slice(1).some(h=>inRing(lng,lat,h)))return c.name;return null}
async function cityFromCoords(lat,lng){
  await loadCounties();
  const has=new Set(DB.cinemas.map(c=>c._city));
  const hit=countyAt(lat,lng);
  return hit&&has.has(hit)?hit:nearestCity(lat,lng); // 所在縣市沒有影城、或在海上 → 最近有影城的縣市
}
let geoBusy=false;
function locateMe(fromUser){
  if(geoBusy)return;
  if(!('geolocation' in navigator)){if(fromUser)toast('這個瀏覽器不支援定位，請手動選擇縣市');return}
  geoBusy=true;if(fromUser){if(sheetOpen)closeSheet();toast('正在取得你的位置…')}
  navigator.geolocation.getCurrentPosition(async pos=>{
    S.here={lat:pos.coords.latitude,lng:pos.coords.longitude,t:Date.now()};
    const city=await cityFromCoords(pos.coords.latitude,pos.coords.longitude);geoBusy=false;
    if(!city){if(fromUser)toast('附近找不到有場次的影城');return}
    store.set('cityMode','auto');store.set('askedCity',true);store.set('geoDenied',false);store.set('geoOK',true);
    const changed=S.city!==city;S.city=city;store.set('city',city);
    if(changed||fromUser){render(true);toast(`已依目前位置顯示${city}的影城`)}
  },err=>{
    geoBusy=false;
    if(err.code===1){store.set('geoDenied',true);store.set('geoOK',false);if(fromUser)toast('沒有定位權限。可到手機「設定 › Safari › 位置」允許，或手動選擇縣市')}
    else if(fromUser)toast('暫時取得不到位置，請手動選擇縣市');
  },{enableHighAccuracy:false,timeout:10000,maximumAge:30*60*1000});
}

function searchResults(){
  const box=$('#qr');if(!box)return;
  const q=S.q.trim().toLowerCase();
  if(!q){box.innerHTML='<div class="note">輸入片名或影城名稱，例如「柯南」或「信義」。</div>';return}
  const norm=s=>String(s||'').toLowerCase().replace(/[\s：:，,。.!！?？《》「」]/g,'');
  const nq=norm(q);
  const ms=DB.movies.filter(m=>(m.status!=='soon'||true)&&(norm(m.title).includes(nq)||norm(m.en).includes(nq))&&(BYM[m.id]||m.status==='soon')).slice(0,12);

  box.innerHTML=h||`<div class="empty"><b>找不到「${esc(S.q)}」</b>試試片名中的其他字，或英文片名。</div>`;

const DIRECT={'秀泰':1,'威秀':1,'新光':1,'美麗華':1,'樂聲':1};
function ticketUrl(c,m,s){const t=s.url||c.ticketUrl||c.site||'#';return t.replace('{movie}',encodeURIComponent(m.id)).replace('{date}',s.date).replace('{time}',encodeURIComponent(s.time))}
function ticketSheet(i){
  const s=DB.shows[i],c=DB.byC[s.cinema],m=DB.byM[s.movie];
  const direct=!!s.url&&DIRECT[c.chain];
  const other=c.chain==='其他影城'; // 由開眼取得的獨立影城：連到該影城官網（沒有官網時連開眼時刻表）
  const who=other?c.name:(c.chain||'官網');
  const viaAt=other&&/atmovies/.test(ticketUrl(c,m,s));
  S.leaveOpen=false; // 出發時間預設收合，主按鈕固定在面板底部
  openSheet(`<div class="tk-body"><h2>${esc(m.title)}</h2><div class="sum"><div><span>影城</span><b>${esc(c.name)}</b></div><div><span>時間</span><b>${md(s.date)} ${esc(s.time)}</b></div>${s.format||s.hall?`<div><span>版本／廳</span><b>${[s.format,s.hall].filter(Boolean).map(esc).join('・')}</b></div>`:''}${s.seats==='low'?'<div><span>座位</span><b style="color:var(--warn)">剩不多</b></div>':''}</div>

function watchSave(){
  const w=WS,created=!w.id,now=new Date(),base={movie:w.movie,title:w.title,area:w.area,dates:[...w.dates].sort(),from:w.from,to:w.to};
  const matches=watchMatches(base);
  let rec;
  if(w.id){
    rec=S.watches.find(x=>x.id===w.id);if(!rec)return;
    Object.assign(rec,base);
    const cur=new Set(matches.map(WC.keyOf)),nk=new Set(rec.newKeys||[]);
    rec.newKeys=[...nk].filter(k=>cur.has(k));
    rec.seen=[...new Set([...(rec.seen||[]),...cur].filter(k=>!nk.has(k)))]; // 改條件後，目前符合的都算已看過（還沒看的新場次保留）
  }else{
    rec={id:'w'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),...base,seen:[],newKeys:[],created:now.getTime()};
    WC.markSeen(rec,matches);S.watches.push(rec);
  }
  rec.checkedAt=now.getTime();
  saveWatches();registerBackground();
  WS.id=rec.id;WS.done={n:matches.length,created};
  watchSheetRefresh();
  render(true); // 底下的頁面（電影頁的「追蹤中」、追蹤頁清單、紅點）同步更新
}

}
// 通知被點開時（App 已開著），背景程式會傳訊息過來，帶到「追蹤」頁
if('serviceWorker' in navigator)navigator.serviceWorker.addEventListener('message',e=>{if(e.data&&e.data.goto)location.hash=e.data.goto});
// 久未使用後回到 App：重新載入場次並比對；否則只同步背景程式寫入的新場次
let hiddenAt=0;
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){hiddenAt=Date.now();return}
  if(hiddenAt&&Date.now()-hiddenAt>20*60*1000&&!sheetOpen)boot();
  else if(S.watches.length)loadWatches().then(()=>{if(S.route==='watch')render(true);else watchChrome()});
});
boot();
</script>
</body>
</html>
