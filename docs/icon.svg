<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c8173a"/>
      <stop offset="1" stop-color="#9c0f27"/>
    </linearGradient>
    <!-- 票根：兩側半圓缺口 -->
    <mask id="cut">
      <rect x="96" y="166" width="320" height="180" rx="24" fill="#fff"/>
      <circle cx="96" cy="256" r="28" fill="#000"/>
      <circle cx="416" cy="256" r="28" fill="#000"/>
    </mask>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <g transform="rotate(-9 256 256)">
    <rect x="96" y="166" width="320" height="180" fill="#fff" mask="url(#cut)"/>
    <!-- 撕票虛線 -->
    <line x1="330" y1="186" x2="330" y2="326" stroke="#e8b9c2" stroke-width="7" stroke-linecap="round" stroke-dasharray="1 17"/>
    <!-- 播放符號：開場 -->
    <path d="M196 211 L272 256 L196 301 Z" fill="#b3122e" stroke="#b3122e" stroke-width="14" stroke-linejoin="round"/>
  </g>
</svg>
